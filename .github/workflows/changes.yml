name: Select affected checks
on:
  workflow_call:
    outputs:
      verify:
        value: ${{ jobs.changes.outputs.verify }}
      browser:
        value: ${{ jobs.changes.outputs.browser }}
      android:
        value: ${{ jobs.changes.outputs.android }}
      prepare:
        value: ${{ jobs.changes.outputs.prepare }}
      browser_specs:
        value: ${{ jobs.changes.outputs.browser_specs }}
      browser_shards:
        value: ${{ jobs.changes.outputs.browser_shards }}
      browser_total:
        value: ${{ jobs.changes.outputs.browser_total }}
      browser_development:
        value: ${{ jobs.changes.outputs.browser_development }}
      browser_production:
        value: ${{ jobs.changes.outputs.browser_production }}
      browser_speech:
        value: ${{ jobs.changes.outputs.browser_speech }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.diff.outputs.verify }}
      browser: ${{ steps.diff.outputs.browser }}
      android: ${{ steps.diff.outputs.android }}
      prepare: ${{ steps.diff.outputs.prepare }}
      browser_specs: ${{ steps.diff.outputs.browser_specs }}
      browser_shards: ${{ steps.diff.outputs.browser_shards }}
      browser_total: ${{ steps.diff.outputs.browser_total }}
      browser_development: ${{ steps.diff.outputs.browser_development }}
      browser_production: ${{ steps.diff.outputs.browser_production }}
      browser_speech: ${{ steps.diff.outputs.browser_speech }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No 1GB upstream submodule is needed to compare product paths.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: diff
        run: node scripts/ci/affected.mjs
