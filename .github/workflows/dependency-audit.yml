name: Dependency advisory audit
# Network advisory audit against the committed lockfile and the pinned upstream runtime lock.
# The offline test in npm test sees only lockfile drift and exception expiry; this sees advisories
# published since the snapshot. Not a required check (docs/ci-cost-policy.md).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Dependency advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the pinned upstream lockfile is read, by commit; the full submodule is not needed.
      - name: Read the pinned upstream lockfile
        run: |
          commit=$(node -p "require('./upstream.lock.json').commit")
          repository=$(node -p "require('./upstream.lock.json').url.replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, '')")
          mkdir -p vendor/eliza
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/${repository}/${commit}/bun.lock" -o vendor/eliza/bun.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fails on an advisory path with no reviewed disposition (root package-lock.json).
      - run: node scripts/dependency-audit.mjs
      # Resident runtime packages at the pinned upstream commit. Runs even when the root audit fails.
      - if: ${{ !cancelled() }}
        run: node scripts/dependency-audit.mjs --resident
