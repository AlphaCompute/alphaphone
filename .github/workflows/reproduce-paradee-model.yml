name: Reproduce pinned Paradee model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare exact native source and conversion dependencies
        run: |
          test "$(uname -m)" = arm64
          git -C vendor/eliza submodule update --init plugins/plugin-local-inference/native/llama.cpp
          python -m pip install 'torch==2.14.0' 'numpy==2.5.4' 'tqdm==4.67.1' 'PyYAML==6.0.3' 'requests==2.32.5'
      - name: Reproduce without changing model pins
        run: python scripts/ci/reproduce-paradee-model.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paradee-macos-reproduction-${{ github.sha }}
          path: artifacts/paradee-reproduction/
          if-no-files-found: error
          retention-days: 7
