name: Android foundation
on:
  # Main pushes rebuild both variants so a broken merge is visible on main itself.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Superseded PR runs are cancelled. Each main push gets its own group: a shared
  # group would still cancel a queued main run when a third push arrives.
  group: android-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The speech wrappers require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: npm ci
      # Pinned in-browser speech model (size/hash verified on every use; Android prunes it).
      - uses: actions/cache@v4
        with:
          path: .eliza/browser-speech
          key: browser-speech-${{ hashFiles('config/browser-speech.json') }}
      - name: Acquire verified browser speech model
        timeout-minutes: 10
        run: npm run browser-speech:prepare
      - name: Verify standalone manual qualification
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify
      - run: node --test vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # Cache only acquisition inputs. Every hit is size/hash verified; generated
      # AARs, extracted sources and models are rebuilt in this clean job.
      - uses: actions/cache@v4
        with:
          path: .eliza/local-speech/downloads
          key: speech-downloads-${{ runner.os }}-${{ hashFiles('vendor/eliza/packages/app/scripts/local-speech/download-manifest.json') }}
      - name: Acquire verified speech source, models and license references
        timeout-minutes: 15
        run: |
          python3 scripts/local-speech/acquire-downloads.py
          python3 scripts/local-speech/make-lexicon.py
      - name: Build and qualify both no-eSpeak runtime ABIs
        timeout-minutes: 65
        run: |
          for abi in arm64-v8a x86_64; do
            python3 scripts/local-speech/build-no-espeak.py --abi "$abi" --ndk "$ANDROID_NDK_HOME" --jobs 2
            python3 scripts/local-speech/strip-runtime.py --abi "$abi" --ndk "$ANDROID_NDK_HOME"
          done
          python3 scripts/local-speech/verify-source.py
      - name: Assemble and verify speech APK inputs
        run: |
          python3 scripts/local-speech/prepare-assets.py
          python3 scripts/local-speech/assemble-runtime.py
          # A Linux build cannot reproduce the qualified macOS natives; install it as an
          # explicitly unqualified runtime (these APKs are build evidence only).
          python3 scripts/local-speech/install-generated.py --repository "$GITHUB_WORKSPACE" --allow-unqualified-runtime
      - name: Prepare pinned native lifecycle sources
        run: node scripts/prepare-local-agent.mjs --source-only
      # Distribution build: flag-off whatever the runner exports. This job stages no
      # resident runtime, so releases are recorded distributable:false (APK-build
      # evidence only); the resident workflow builds and verifies PACKAGED releases.
      - name: Build flag-off distribution APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ""
        run: npm run android:build -- --allow-unpackaged-runtime
      - name: Require test-mock-free distribution
        run: |
          node scripts/audit-production-bundle.mjs web-dist
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/apk-manifest.json', 'utf8'));
          if (manifest.testMocks !== false || manifest.demoEntryPoints !== false) throw new Error('Distribution APKs must be testMocks:false and demoEntryPoints:false');
          if (manifest.results.length !== 4 || manifest.results.some(row => row.testMocks !== false || row.bundleAudit !== 'passed')) throw new Error('Every distribution APK must pass the flag-off bundle audit');
          console.log(JSON.stringify({ testMocks: manifest.testMocks, demoEntryPoints: manifest.demoEntryPoints, version: manifest.version, signing: manifest.signing.release }, null, 2));
          NODE
      - run: npm run aosp:stage -- --apk artifacts/launcher-debug.apk --development
      - uses: actions/upload-artifact@v4
        with:
          name: android-distribution-apks-${{ github.run_id }}-${{ github.run_attempt }}
          # R8 mappings travel with the exact APKs they deobfuscate.
          path: |
            artifacts/*.apk
            artifacts/mapping/*.txt
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          path: |
            artifacts/*.json
            artifacts/aosp/
            !artifacts/aosp/**/*.apk
            test-results/
            android/app/build/reports/
            .eliza/local-speech/build-*/build.log
            .eliza/local-speech/build-*/qualification*.json
            .eliza/local-speech/generated/lexicon-provenance.json
            android/local-speech/runtime-manifest.json
            android/local-speech/src/main/assets/local-speech/v1/manifest.json
          retention-days: 3
  # Stable required check. The ruleset in docs/ci-cost-policy.md requires this job:
  # it passes when the change gate did not select Android and fails when the
  # selected build failed, was cancelled or did not run.
  result:
    name: Android foundation result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - env:
          SELECTED: ${{ needs.changes.outputs.android }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: node scripts/ci/required-result.mjs "changes=$CHANGES" "build=$BUILD:$SELECTED"
