name: Android foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify
      - run: node --test vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # Cache only acquisition inputs. Every hit is size/hash verified; generated
      # AARs, extracted sources and models are rebuilt in this clean job.
      - uses: actions/cache@v4
        with:
          path: scripts/local-speech/downloads
          key: speech-downloads-${{ runner.os }}-${{ hashFiles('scripts/local-speech/download-manifest.json') }}
      - name: Acquire verified speech source, models and license references
        timeout-minutes: 15
        run: |
          python3 scripts/local-speech/acquire-downloads.py
          python3 scripts/local-speech/make-lexicon.py
      - name: Build and qualify both no-eSpeak runtime ABIs
        timeout-minutes: 65
        run: |
          for abi in arm64-v8a x86_64; do
            python3 scripts/local-speech/build-no-espeak.py --abi "$abi" --ndk "$ANDROID_NDK_HOME" --jobs 2
            python3 scripts/local-speech/strip-runtime.py --abi "$abi" --ndk "$ANDROID_NDK_HOME"
          done
          python3 scripts/local-speech/verify-source.py
      - name: Assemble and verify speech APK inputs
        run: |
          python3 scripts/local-speech/prepare-assets.py
          python3 scripts/local-speech/assemble-runtime.py
          python3 scripts/local-speech/install-generated.py --repository "$GITHUB_WORKSPACE"
      - run: npm run android:build
      - run: npm run aosp:stage -- --apk artifacts/launcher-debug.apk --development
      - name: Preserve artifacts and release owned speech build intermediates
        run: |
          df -h "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$HOME"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path.cwd()
          speech = root / 'scripts/local-speech'
          evidence = root / 'test-results/emulator-disk-preflight'
          evidence.mkdir(parents=True, exist_ok=True)
          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()
          retained = []
          for folder in ('artifacts', 'android/app/build/outputs/apk', 'android/local-speech/libs', 'android/local-speech/src/main/assets'):
              retained.extend(p for p in (root / folder).rglob('*') if p.is_file())
          retained.append(root / 'android/local-speech/runtime-manifest.json')
          assert retained and all(p.is_file() and not p.is_symlink() for p in retained)
          hashes = {str(p.relative_to(root)): digest(p) for p in retained}
          for abi in ('arm64-v8a', 'x86_64'):
              build = speech / ('build-' + abi)
              for source in [build / 'build.log', *build.glob('qualification*.json')]:
                  assert source.is_file() and not source.is_symlink()
                  dest = evidence / abi / source.name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, dest)
                  assert digest(source) == digest(dest)
                  hashes[str(dest.relative_to(root))] = digest(dest)
          paths = ['build-arm64-v8a', 'build-x86_64', 'native-source', 'models', 'onnxruntime', 'assets-ready', 'source']
          state = {'beforeFreeBytes': shutil.disk_usage(root).free, 'removed': paths, 'retainedHashes': hashes}
          for relative in paths:
              target = speech / relative
              assert target.is_dir() and not target.is_symlink(), str(target)
              shutil.rmtree(target)
          assert all(digest(root / name) == expected for name, expected in hashes.items())
          state['retainedReadbackPassed'] = True
          state['freeBytes'] = {name: shutil.disk_usage(path).free for name, path in {'workspace': root, 'androidSdk': Path(os.environ['ANDROID_HOME']), 'avdHome': Path.home()}.items()}
          state['requiredFreeBytes'] = 8 * 1024 ** 3
          state['passed'] = min(state['freeBytes'].values()) >= state['requiredFreeBytes']
          (evidence / 'result.json').write_text(json.dumps(state, indent=2) + '\n')
          print(json.dumps({k: v for k, v in state.items() if k != 'retainedHashes'}, indent=2))
          assert state['passed'], 'Insufficient capacity for system image, 2 GiB AVD and reports; see disk preflight evidence'
          PYTHON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disk-size: 2048M
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 node scripts/prepare-ci-emulator.mjs
            ANDROID_SERIAL=emulator-5554 npm run android:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-foundation
          path: |
            artifacts/
            test-results/
            android/app/build/reports/
            scripts/local-speech/build-*/build.log
            scripts/local-speech/build-*/qualification*.json
            scripts/local-speech/generated/lexicon-provenance.json
            android/local-speech/runtime-manifest.json
            android/local-speech/src/main/assets/local-speech/v1/manifest.json
          retention-days: 14
