name: Android emulator evidence
# Dispatch only. Every job after `build` boots an emulator on a hosted runner, so nothing
# here runs on a push, a pull request or a schedule (docs/ci-cost-policy.md). The result is
# emulator-class evidence on developer-override APKs (unpackaged resident runtime; for
# fused-speech, an unreviewed CI build of the x86_64 voice host) on an x86_64 SDK image:
# never a distributable build, a device or acceptance.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Emulator evidence to produce (each suite is its own job; all runs the three)
        type: choice
        required: true
        default: instrumentation
        options:
          - instrumentation
          - browser-reading
          - fused-speech
          - all
permissions:
  contents: read
concurrency:
  # A later dispatch of the same suite on the same ref supersedes the earlier one.
  group: android-emulator-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true
jobs:
  build:
    name: Build developer APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_id: ${{ steps.apks.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
      manifest_sha256: ${{ steps.freeze.outputs.manifest }}
      test_mocks_manifest_sha256: ${{ steps.freeze.outputs.test_mocks_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The fused engine wrappers (prepare-embedding-host) require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: npm ci
      # On-device speech is the shared paradee-voice library on libelizainference (Paradee-8M TTS,
      # misaki G2P, the ASR slot pair, Silero VAD). A developer APK that can speak needs the staged
      # voice outputs (scripts/android-stage-voice-models.mjs) AND an embedding host built from the
      # same engine bytes (Gradle :app:verifyParadeeAppLinkage). The hosted job cannot produce that
      # pair yet: the embedding host at this pin needs a reviewed receipt (requalification), and the
      # Paradee GGUF/lexicon are not published for download. Refuse instead of building an APK that
      # would only prove local speech is unavailable.
      - name: Refuse the fused-speech suite until hosted voice staging exists
        if: inputs.suite == 'fused-speech' || inputs.suite == 'all'
        run: |
          echo "::error::fused-speech needs staged Paradee voice outputs and a same-engine embedding host; see docs/fused-speech.md (hosted staging is an open item)"
          exit 1
      - name: Prepare pinned native lifecycle sources
        run: node scripts/prepare-local-agent.mjs --source-only
      - name: Build flag-off developer APKs with their instrumentation APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ""
        run: npm run android:build -- --allow-unpackaged-runtime
      # Only the reading classes that use a loopback speech route need this second build.
      - name: Build the separate test-mocks APKs
        if: inputs.suite == 'browser-reading' || inputs.suite == 'all'
        run: |
          before=$(sha256sum artifacts/*.apk artifacts/instrumentation/*.apk)
          npm run android:build -- --test-mocks
          test "$before" = "$(sha256sum artifacts/*.apk artifacts/instrumentation/*.apk)"
      - name: Anchor the exact manifests
        id: freeze
        run: |
          {
            echo "manifest=$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)"
            if [ -f artifacts/test-mocks/apk-manifest.json ]; then
              echo "test_mocks_manifest=$(sha256sum artifacts/test-mocks/apk-manifest.json | cut -d' ' -f1)"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: apks
        with:
          name: android-emulator-apks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Paths keep their place under the workspace, so the emulator jobs download them in place.
          path: |
            artifacts/apk-manifest.json
            artifacts/standalone-debug.apk
            artifacts/launcher-debug.apk
            artifacts/instrumentation/*.apk
            artifacts/test-mocks/apk-manifest.json
            artifacts/test-mocks/*-debug.apk
            artifacts/test-mocks/*-androidTest.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.json
            artifacts/test-mocks/*.json
            android/app/build/reports/
            android/voice-host/qualified-voice-host.json
            .eliza/paradee-voice/native/build-record.json
          retention-days: 3

  # (c) The default instrumentation run on both distributions.
  instrumentation:
    name: Default instrumentation, both distributions
    needs: build
    if: inputs.suite == 'instrumentation' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      # The runner imports only checked-in scripts and Node builtins; no dependency install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .
          merge-multiple: true
      - name: Require the build job's exact APK manifest, capacity and KVM
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/ci/emulator-suite.mjs instrumentation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-instrumentation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/android-instrumentation/
            test-results/emulator-suite/
            test-results/android-fixture/
            artifacts/apk-manifest.json
          if-no-files-found: error
          retention-days: 3

  # (b) The reading and page-question classes, on the pinned Chromium 157 WebView.
  browser-reading:
    name: Browser reading on WebView 157
    needs: build
    if: inputs.suite == 'browser-reading' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      EXPECTED_TEST_MOCKS_MANIFEST_SHA256: ${{ needs.build.outputs.test_mocks_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .
          merge-multiple: true
      - name: Require the build job's exact APK manifests, capacity and KVM
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          test -n "$EXPECTED_TEST_MOCKS_MANIFEST_SHA256"
          test "$(sha256sum artifacts/test-mocks/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_TEST_MOCKS_MANIFEST_SHA256"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          # Chromium recommends at least 4 GB of guest storage for WebView development.
          disk-size: 4096M
          # The provider is replaced on this fresh disposable AOSP image only: a writable system
          # partition, host Vulkan off across the framework restart, and the boot devices the
          # provisioner reads back (docs/ci-webview-provider.md).
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -writable-system -append-userspace-opt 'androidboot.boot_devices=pci0000:00/0000:00:03.0 pci0000:00/0000:00:05.0 pci0000:00/0000:00:06.0'
          disable-animations: true
          script: node scripts/ci/emulator-suite.mjs browser-reading
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-browser-reading-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The pinned URL and hashes reproduce the provider archive; it is not uploaded again.
          path: |
            test-results/android-instrumentation/
            test-results/emulator-suite/
            test-results/android-fixture/
            test-results/ci-webview-provider/
            !test-results/ci-webview-provider/chromium.zip
            !test-results/ci-webview-provider/SystemWebView.apk
            artifacts/apk-manifest.json
            artifacts/test-mocks/apk-manifest.json
          if-no-files-found: error
          retention-days: 3

  # (a) The x86_64 half of on-device speech: the fused-speech classes against the developer APK
  # that carries the voice bundle. Admission still needs arm64-v8a hardware and a named reviewer.
  fused-speech:
    name: On-device speech on x86_64
    needs: build
    if: inputs.suite == 'fused-speech' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-emulator-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-evidence
      - name: Require the build job's exact APK manifest and voice bundle, capacity and KVM
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifacts/apk-manifest.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          # The build job's workspace record (unreviewed x86_64 receipt) is what the APK was admitted against.
          cp build-evidence/android/voice-host/qualified-voice-host.json android/voice-host/qualified-voice-host.json
          node scripts/ci/speech-candidate.mjs check artifacts/standalone-debug.apk
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 8*1024**3, "Insufficient fresh-runner emulator capacity"'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/ci/emulator-suite.mjs fused-speech
      - name: Package the run with its exact APK pair
        if: always()
        run: node scripts/ci/speech-candidate.mjs package test-results/android-instrumentation/ci-fused-speech test-results/fused-speech-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fused-speech-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/fused-speech-x86_64/
            test-results/emulator-suite/
            test-results/android-fixture/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
