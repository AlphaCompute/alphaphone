name: Browser MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Browser MVP (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Includes setup, repository verification, over 600 UI cases and speech checks.
    # A hosted run reached 617/619 passing cases at the former 45-minute limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned JSON dependency for host contract tests
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/json-20250517.jar"
          curl --fail --location --retry 3 --max-time 60 \
            https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar \
            --output "$jar"
          echo "3ea61b2a06e31edf1c91134fe9106b0ebb16628be169f3db75bc7a2b06b45796  $jar" | sha256sum --check --strict
          echo "ALPHA_JSON_JAR=$jar" >> "$GITHUB_ENV"
      - run: npm run verify
      - name: Browser MVP on the flag-on development server
        env:
          # Development shards opt into test mocks, fixtures and device controls explicitly.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      - name: Exercise synthetic local-agent speech profile
        if: matrix.shard == 1
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.env.RUNNER_TEMP + '/alpha-synthetic-owner-token', 'a'.repeat(64), {mode: 0o600});"
          PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/browser-agent-profile-report ELIZA_DEV_ALLOW_TEST_MOCKS=1 VITE_LOCAL_AGENT=1 ALPHA_LOCAL_AGENT_TOKEN_FILE="$RUNNER_TEMP/alpha-synthetic-owner-token" ALPHA_LOCAL_AGENT_ORIGIN=http://127.0.0.1:1 npm run test:browser -- test/browser/browser-agent-recording.spec.ts test/browser/browser-agent-tts.spec.ts test/browser/browser-host-disclosure.spec.ts --grep 'rendered browser recording|local agent TTS|prepared agent audio|connected browser host' --output=test-results/browser-agent-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-mvp-shard-${{ matrix.shard }}-of-3
          path: |
            test-results/browser/
            test-results/browser-report/
            test-results/browser-agent-profile/
            test-results/browser-agent-profile-report/
          retention-days: 14
  production:
    name: Browser production surface (flag off)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production bundle audit
        run: |
          npm run build
          node scripts/audit-production-bundle.mjs web-dist
      - name: Test-mocks bundle records its flag
        run: |
          npm run build:test-mocks -- --outDir ../../test-results/test-mocks-web
          node scripts/audit-production-bundle.mjs test-results/test-mocks-web --expect-test-mocks
      # Builds and previews a flag-off bundle; the flag is deliberately unset here.
      - run: npm run test:browser:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-production-surface
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 14
  storage:
    name: Browser storage (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    # Linux WebKit lacks MediaRecorder in the hosted build. Run the complete
    # WebKit inventory on macOS so Notes records real audio before storage,
    # reload and playback checks; do not replace recording with a fixture/skip.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'ubuntu-latest' }}
    # The storage projects run 297 cases per browser. Unsharded, the hosted Firefox
    # lane took 15-21 minutes of test time and WebKit 19-21 minutes, close to the
    # former 30-minute limit and growing with every storage spec. Two shards keep
    # each job near 10 minutes; the limit leaves room for runner variance.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify canonical storage and asynchronous Cloud setup
        env:
          # Storage specs run against the flag-on development server.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        # The firefox and webkit projects in playwright.config.ts select the storage specs.
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-storage-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-2
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 14
