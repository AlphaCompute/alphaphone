pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
include ':app', ':capacitor-android', ':eliza-system'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
project(':eliza-system').projectDir = new File('../vendor/eliza/plugins/plugin-native-system/android')

include ':eliza-camera'
project(':eliza-camera').projectDir = new File('../vendor/eliza/plugins/plugin-native-camera/android')


include ':eliza-location'
project(':eliza-location').projectDir = new File('../vendor/eliza/plugins/plugin-native-location/android')

// Explicit standalone synthetic witness; never packaged in Alpha Phone.
include ':notification-fixture'

include ':local-speech'
include ':eliza-network-policy'
project(':eliza-network-policy').projectDir = new File('../vendor/eliza/plugins/plugin-native-network-policy/android')



// Reviewed upstream candidates applied outside vendor/eliza (patches/eliza/NNNN-*.patch).
// npm run upstream:prepare-client (run by npm run build / android:build) materializes it.
if (!new File(settingsDir, '../.eliza/patched/.source.json').isFile())
 throw new GradleException('Patched Eliza source is not prepared. Run: npm run upstream:prepare-client')
// The pin includes the read-package source identity fix (historical patch 0039).
// Calendar also consumes the reviewed source selection candidate 0041.
include ':eliza-calendar'
project(':eliza-calendar').projectDir = new File('../.eliza/patched/plugins/plugin-native-calendar/android')
// Reminders carry patches/eliza/0040-reminders-lifecycle.patch (refusal codes, re-post, due channel, to-dos).
include ':eliza-reminders'
project(':eliza-reminders').projectDir = new File('../.eliza/patched/plugins/plugin-native-reminders/android')
include ':elizaos-capacitor-secure-store'
project(':elizaos-capacitor-secure-store').projectDir = new File('../.eliza/patched/plugins/plugin-native-secure-store/android')
include ':eliza-passwords'
project(':eliza-passwords').projectDir = new File('../.eliza/patched/plugins/plugin-native-passwords/android')
