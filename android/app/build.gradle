apply plugin: 'com.android.application'
def identity = new groovy.json.JsonSlurper().parse(file('../../app.config.json'))
// Upstream switch (vendor/eliza/packages/app/scripts/dev-ui.ts): exactly "1" opts
// test-only mocks and developer hooks into DEBUG variants. Release never gets them.
def testMocksRaw = project.findProperty('ELIZA_DEV_ALLOW_TEST_MOCKS') ?: System.getenv('ELIZA_DEV_ALLOW_TEST_MOCKS')
def testMocksEnabled = testMocksRaw != null && testMocksRaw.toString() == '1'
// Upstream release names. Version values must be positive integers / plain labels.
def envValue = { String name -> def value = System.getenv(name); value == null || value.trim().isEmpty() ? null : value.trim() }
def versionCodeSource = envValue('ELIZAOS_VERSION_CODE') != null ? 'ELIZAOS_VERSION_CODE' : 'app.config.json versionCode'
def versionCodeRaw = (envValue('ELIZAOS_VERSION_CODE') ?: identity.versionCode)?.toString()
if (versionCodeRaw == null || !(versionCodeRaw ==~ /[1-9][0-9]{0,9}/) || versionCodeRaw.toLong() > 2100000000L)
 throw new GradleException("${versionCodeSource} must be a positive integer no greater than 2100000000")
def appVersionCode = versionCodeRaw.toInteger()
def appVersionName = (envValue('ELIZAOS_VERSION_NAME') ?: identity.version)?.toString()
if (appVersionName == null || !(appVersionName ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}/))
 throw new GradleException('ELIZAOS_VERSION_NAME / app.config.json version must be a plain version label')
// Release signing is applied only when all four upstream variables are present.
// A partial set fails the build. Values are never printed; names only.
def releaseSigningNames = ['ELIZAOS_KEYSTORE_PATH', 'ELIZAOS_KEYSTORE_PASSWORD', 'ELIZAOS_KEY_ALIAS', 'ELIZAOS_KEY_PASSWORD']
def releaseSigningMissing = releaseSigningNames.findAll { envValue(it) == null }
def releaseSigningReady = releaseSigningMissing.isEmpty()
if (!releaseSigningReady && releaseSigningMissing.size() < releaseSigningNames.size())
 throw new GradleException("[release-signing] incomplete signing environment. Missing: ${releaseSigningMissing.join(', ')}. Set all four ELIZAOS_KEYSTORE_PATH, ELIZAOS_KEYSTORE_PASSWORD, ELIZAOS_KEY_ALIAS and ELIZAOS_KEY_PASSWORD, or none.")
if (releaseSigningReady && !file(envValue('ELIZAOS_KEYSTORE_PATH')).isFile())
 throw new GradleException('ELIZAOS_KEYSTORE_PATH does not name a readable keystore file')
// Verified App Links return for Eliza Cloud delegation. Unset by default: no https autoVerify
// filter is emitted. When set, a generated overlay adds the filter for ${appLinkHost}; publish
// the assetlinks.json rendered by scripts/render-assetlinks.mjs on that host first.
def appLinkHostRaw = project.findProperty('ELIZAOS_APP_LINK_HOST') ?: envValue('ELIZAOS_APP_LINK_HOST')
def appLinkHost = appLinkHostRaw == null || appLinkHostRaw.toString().trim().isEmpty() ? '' : appLinkHostRaw.toString().trim()
if (appLinkHost && !(appLinkHost ==~ /(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{0,61}[a-z0-9]/))
 throw new GradleException('ELIZAOS_APP_LINK_HOST must be a lower-case DNS host name without scheme, port or path')
def appLinksManifest = 'build/generated/app-links/AndroidManifest.xml'
if (appLinkHost) {
 file(appLinksManifest).parentFile.mkdirs()
 file(appLinksManifest).text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by android/app/build.gradle from ELIZAOS_APP_LINK_HOST. -->
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
 <application>
  <activity android:name="${identity.appId}.MainActivity">
   <intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="https" android:host="\${appLinkHost}" android:pathPrefix="/alphaphone/cloud-delegation"/></intent-filter>
  </activity>
 </application>
</manifest>
"""
} else file(appLinksManifest).delete()
android {
 namespace identity.appId
 compileSdk rootProject.ext.compileSdkVersion
 defaultConfig {
  applicationId identity.appId
  minSdk rootProject.ext.minSdkVersion
  targetSdk rootProject.ext.targetSdkVersion
  versionCode appVersionCode
  versionName appVersionName
  resValue 'string', 'app_name', identity.appName
  manifestPlaceholders = [appOrientation: identity.orientation, appLinkHost: appLinkHost]
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true }
 defaultConfig {
  buildConfigField 'boolean', 'AOSP_BUILD', 'false'
  buildConfigField 'String', 'ELIZA_CHROMIUM_PACKAGE_NAME', '""'
  buildConfigField 'String', 'ELIZA_CHROMIUM_CERT_SHA256', '""'
  buildConfigField 'boolean', 'ELIZA_DEV_ALLOW_TEST_MOCKS', 'false'
 }
 // Developer hooks (DevelopmentAgentPlugin, DevelopmentVoiceCapture, SyntheticAutofillService,
 // loopback cleartext config, peer-fixture visibility) are attached to debug variants only
 // when the switch is on, following upstream's lp3ColorPolicyBuildEnabled source-set pattern.
 sourceSets {
  if (testMocksEnabled) {
   debug.java.srcDir file('src/testMocks/java')
   debug.res.srcDir file('src/testMocks/res')
   debug.manifest.srcFile file('src/testMocks/AndroidManifest.xml')
   androidTest.java.srcDir file('src/testMocks/androidTest/java')
  }
 }
 sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/local-agent/java')
 packagingOptions { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libeliza_*.so', '**/libsigsys-handler.so'] } }
 flavorDimensions += 'distribution'
 productFlavors {
  standalone { dimension 'distribution'; buildConfigField 'boolean', 'IS_LAUNCHER', 'false' }
  launcher { dimension 'distribution'; buildConfigField 'boolean', 'IS_LAUNCHER', 'true' }
 }
 signingConfigs {
  if (releaseSigningReady) {
   release {
    storeFile file(envValue('ELIZAOS_KEYSTORE_PATH'))
    storePassword envValue('ELIZAOS_KEYSTORE_PASSWORD')
    keyAlias envValue('ELIZAOS_KEY_ALIAS')
    keyPassword envValue('ELIZAOS_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug {
   debuggable true
   buildConfigField 'boolean', 'ELIZA_DEV_ALLOW_TEST_MOCKS', testMocksEnabled ? 'true' : 'false'
   // Match the resident runtime and reviewed native libraries; dependencies may also ship 32-bit ABIs.
   ndk { abiFilters 'arm64-v8a', 'x86_64' }
  }
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   // Shipping hardware is ARM64; debug/CI also supports the x86_64 emulator.
   ndk { abiFilters 'arm64-v8a' }
   if (releaseSigningReady) signingConfig signingConfigs.release
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
if (appLinkHost) androidComponents { onVariants(selector().all()) { variant -> variant.sources.manifests.addStaticManifestFile(appLinksManifest) } }
dependencies {
 implementation project(':eliza-network-policy')
 implementation 'androidx.browser:browser:1.9.0'
    implementation "androidx.work:work-runtime:2.11.0"
 implementation project(':capacitor-android')
 implementation project(':eliza-system')
 implementation project(':eliza-notifications')
 implementation project(':eliza-owned-media')
 implementation project(':eliza-action-journal')
 implementation project(':eliza-contacts')
 implementation project(':eliza-camera')
 implementation project(':eliza-calendar')
 implementation project(':eliza-reminders')
 implementation project(':eliza-location')
 implementation project(':eliza-passwords')
 implementation project(':elizaos-capacitor-secure-store')
 implementation "androidx.webkit:webkit:$rootProject.ext.androidxWebkitVersion"
 implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
 implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 // Accessibility (ATF through Espresso) and TalkBack-order/rotation checks over the real UI.
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
 androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
def stageLocalAgentSources = tasks.register('stageLocalAgentSources', Exec) {
 workingDir rootProject.projectDir.parentFile
 commandLine 'node', 'scripts/stage-local-agent-sources.mjs'
}
tasks.named('preBuild').configure { dependsOn stageLocalAgentSources }

// The shared bionic host is packaged only from the reviewed consumer artifact and BGE pin.
def verifyEmbeddingHost = tasks.register('verifyEmbeddingHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 def args = ['node', 'scripts/stage-embedding-host.mjs', '--verify']
 if (project.findProperty('ELIZA_ALLOW_UNPACKAGED_RUNTIME') == '1') args += '--allow-unpackaged-runtime'
 commandLine args
}
tasks.named('preBuild').configure { dependsOn verifyEmbeddingHost }

// On-device voice (fused libelizainference ASR/Kokoro/VAD) is packaged only from bytes that match
// android/voice-host/qualified-voice-host.json. An APK without assets/voice is valid: local speech
// then reports unavailable and the product stays on the Cloud route (P-07).
def verifyVoiceHost = tasks.register('verifyVoiceHost', Exec) {
 workingDir rootProject.projectDir.parentFile
 def args = ['node', 'scripts/stage-embedding-host.mjs', '--verify-voice']
 if (project.findProperty('ELIZA_ALLOW_UNPACKAGED_RUNTIME') == '1') args += '--allow-unpackaged-runtime'
 commandLine args
}
tasks.named('preBuild').configure { dependsOn verifyVoiceHost }

// The authenticated source receipt travels with every application APK, binding audits to built bytes.
def nativePatchAssets = layout.buildDirectory.dir('generated/native-patch-assets')
android.sourceSets.main.assets.srcDir(nativePatchAssets)
def stageNativePatchReceipt = tasks.register('stageNativePatchReceipt', Copy) {
 from(gradle.ext.nativePatchReceipt) { rename { 'native-patches.json' } }
 into(nativePatchAssets)
}
tasks.named('preBuild').configure { dependsOn stageNativePatchReceipt }
