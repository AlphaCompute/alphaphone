<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consolidation map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&amp;text=%CE%B1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050505}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.mono{font-family:'Public Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.16em;font-size:10.5px}
@font-face{font-family:'Denton';src:url(/_blob/2ee0beaef4465f209d65735d3ca35aa5) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
.serif{font-family:'Denton','Fraunces',Georgia,serif;font-weight:300;font-variation-settings:'opsz' 144}
</style>
</helmet>
<div style="width: 1560px; height: 1180px; box-sizing: border-box; padding: 56px 60px; background: #050505; color: #ffffff; font-family: 'Public Sans', system-ui, sans-serif; display: grid; grid-template-columns: 560px 60px minmax(0, 1fr); column-gap: 20px">

  <div style="display: flex; flex-direction: column; gap: 28px">
    <div><div class="mono" style="color: #8f8f8f">Before · v3 mobile shell</div><div class="serif" style="font-size: 44px; margin-top: 10px; line-height: 1">~64 surfaces</div></div>
    <sc-for list="{{before}}" as="g" hint-placeholder-count="2">
      <div>
        <div class="mono" style="color: #8f8f8f; margin-bottom: 12px">{{g.label}}</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{g.items}}" as="c" hint-placeholder-count="12">
            <span style="height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12.5px; display: flex; align-items: center; {{c.css}}">{{c.l}}</span>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; gap: 18px; margin-top: 6px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #bbbbbb"><span style="width: 12px; height: 12px; border-radius: 6px; border: 1px solid #333"></span>Merged into a new home</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #bbbbbb"><span style="width: 12px; height: 12px; border-radius: 6px; border: 1px dashed #666"></span>Cut from the phone shell</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center">
    <svg class="i" viewBox="0 0 24 24" style="width: 40px; height: 40px; color: #0000FF; stroke-width: 1.2"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px">
    <div><div class="mono" style="color: #8A93FF">After · powered by elizaOS</div><div class="serif" style="font-size: 44px; margin-top: 10px; line-height: 1">1 agent · 14 apps · 4 system states</div></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{after}}" as="a" hint-placeholder-count="10">
        <div style="padding: 18px; border-radius: 22px; display: flex; flex-direction: column; gap: 12px; {{a.css}}">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; {{a.icss}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{a.d}}"></path></svg></span>
            <div style="flex-grow: 1"><div style="font-weight: 700; font-size: 17px">{{a.name}}</div><div class="mono" style="color: #8f8f8f; margin-top: 3px; letter-spacing: .1em; font-size: 9.5px">{{a.role}}</div></div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 5px">
            <sc-for list="{{a.from}}" as="f" hint-placeholder-count="5"><span style="height: 24px; padding: 0 9px; border-radius: 12px; border: 1px solid #2a2a2a; font-size: 11.5px; color: #bbbbbb; display: flex; align-items: center">{{f}}</span></sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1560,"height":1180}}'>
var IC = {
  agent: "M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18",
  power: "M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0",
  lock: "M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3",
  home: "M4 11l8-7 8 7v9H4z",
  bell: "M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4",
  inbox: "M3 13h5l1.5 3h5l1.5-3h5M5.5 5h13L21 13v6H3v-6z",
  cal: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",
  notes: "M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5",
  globe: "M21 12a9 9 0 1 1-18 0a9 9 0 1 1 18 0zM3 12h18M12 3c2.6 2.6 3.6 5.6 3.6 9s-1 6.4-3.6 9M12 3c-2.6 2.6-3.6 5.6-3.6 9s1 6.4 3.6 9",
  flow: "M8 6a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM20 18a2 2 0 1 1-4 0a2 2 0 1 1 4 0zM6 8v3a5 5 0 0 0 5 5h5",
  gear: "M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4",
  grid: "M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"
};
var CUT = ["arcade", "trade", "shop", "inventory", "glasses", "stream", "views", "apps", "activity", "ShortcutsOverlay", "PagerEdgeButtons"];
class Component extends DCLogic {
  renderVals() {
    var chip = function (l) { var cut = CUT.indexOf(l) >= 0; return { l: l, css: cut ? "border:1px dashed #666;color:#8f8f8f;text-decoration:line-through" : "border:1px solid #333;color:#dddddd" }; };
    var before = [
      { label: "Shell chrome · 15", items: ["HomeLauncherSurface", "TrayLauncher", "PagerEdgeButtons", "Home widgets", "HomePill", "ChatOverlay · 7 states", "AssistantOverlay", "VoiceCaptureHud", "CommandPalette", "NotificationsHomeCenter", "ActionNoticeToast", "ShortcutsOverlay", "FirstSessionSwipeHint", "StartupScreen · 6 phases", "LoadingScreen"].map(chip) },
      { label: "Launcher views · 50", items: ["chat", "voice", "character", "character-select", "companion", "inbox", "messages", "feed", "phone", "contacts", "rolodex", "relationships", "calendar", "tasks", "focus", "automations", "triggers", "orchestrator", "skills", "browser", "desktop", "screenshare", "transcripts", "files", "memories", "database", "vectors", "logs", "trajectory", "trajectories", "runtime", "models", "plugins", "keys", "network", "background", "advanced", "settings", "camera", "health", "wallet", "trade", "shop", "inventory", "arcade", "glasses", "stream", "views", "apps", "activity"].map(chip) }
    ];
    var sys = "background:#0d0d0d;border:1px solid #222";
    var view = "background:#111111;border:1px solid #262626";
    var after = [
      { name: "Agent surface", role: "One thread · pill → input → overlay → full · voice", d: IC.agent, css: "background:#0000FF;border:1px solid #0000FF", icss: "background:#ffffff;color:#0000FF", from: ["HomePill", "ChatOverlay", "AssistantOverlay", "VoiceCaptureHud", "CommandPalette", "ActionNoticeToast", "chat", "voice", "companion"] },
      { name: "Boot · Lock · Shade", role: "Logo, lock, notifications, quick settings", d: IC.power, css: sys, icss: "border:1px solid #333", from: ["StartupScreen", "LoadingScreen", "NotificationsHomeCenter", "lock screen (new)"] },
      { name: "Home", role: "Now cards · every app in one grid · composer", d: IC.home, css: sys, icss: "border:1px solid #333", from: ["HomeLauncherSurface", "Home widgets", "TrayLauncher", "launcher pages", "FirstSessionSwipeHint"] },
      { name: "Phone · Contacts", role: "Calls Alpha can screen and take notes on", d: IC.bell, css: view, icss: "border:1px solid #333", from: ["phone", "contacts", "rolodex", "relationships"] },
      { name: "Messages · Inbox", role: "Texts and email, one list each", d: IC.inbox, css: view, icss: "border:1px solid #333", from: ["messages", "inbox", "feed"] },
      { name: "Calendar", role: "Day, month, invites, prep", d: IC.cal, css: view, icss: "border:1px solid #333", from: ["calendar", "tasks", "focus"] },
      { name: "Camera · Photos", role: "Capture, scan, library, search", d: IC.grid, css: view, icss: "border:1px solid #333", from: ["camera", "screenshare (scan)"] },
      { name: "Maps · Wallet", role: "Directions, navigation, pay, passes", d: IC.grid, css: view, icss: "border:1px solid #333", from: ["wallet", "maps (new)"] },
      { name: "Notes · Files", role: "Type, dictate, record, transcribe", d: IC.notes, css: view, icss: "border:1px solid #333", from: ["transcripts", "memories (user-facing)", "files"] },
      { name: "Browser", role: "You or the agent drive it", d: IC.globe, css: view, icss: "border:1px solid #333", from: ["browser", "desktop / computer use"] },
      { name: "Workflows", role: "Summary, diagram, run history", d: IC.flow, css: view, icss: "border:1px solid #333", from: ["automations", "triggers", "orchestrator", "skills"] },
      { name: "Settings", role: "Character, accounts, privacy first", d: IC.gear, css: view, icss: "border:1px solid #333", from: ["character", "character-select", "models", "keys", "plugins", "network", "background", "advanced", "Developer: logs, trajectories, runtime, database, vectors"] }
    ];
    return { before: before, after: after };
  }
}
</script>
</body>
</html>
