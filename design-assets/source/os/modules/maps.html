<div style="display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden">
  <!-- map -->
  <div onPointerDown="{{maps.mapDown}}" onPointerUp="{{maps.mapUp}}" style="position: absolute; inset: 0; overflow: hidden; background: {{maps.C.land}}; touch-action: none">
    <div style="position: absolute; left: 0; top: 0; width: {{maps.W}}px; height: {{maps.H}}px; transform-origin: 0 0; transform: {{maps.tr}}; transition: transform .6s cubic-bezier(.19,1,.22,1)">
      <svg width="1200" height="3200" viewBox="0 0 1200 3200" style="display: block">
        <rect x="0" y="0" width="1200" height="3200" style="fill: {{maps.C.land}}"></rect>
        <path d="{{maps.grid}}" style="fill: none; stroke: {{maps.C.minor}}; stroke-width: 7"></path>
        <path d="{{maps.parks}}" style="fill: {{maps.C.park}}"></path>
        <path d="{{maps.major}}" style="fill: none; stroke: {{maps.C.major}}; stroke-width: 13; stroke-linecap: round"></path>
        <path d="{{maps.water}}" style="fill: {{maps.C.water}}"></path>
        <path d="{{maps.fwy}}" style="fill: none; stroke: {{maps.C.fwyE}}; stroke-width: 22; stroke-linejoin: round; stroke-linecap: round"></path>
        <path d="{{maps.fwy}}" style="fill: none; stroke: {{maps.C.fwy}}; stroke-width: 16; stroke-linejoin: round; stroke-linecap: round"></path>
        <path d="{{maps.rwy}}" style="fill: none; stroke: {{maps.C.rwy}}; stroke-width: 20"></path>
        <path d="{{maps.doneD}}" style="fill: none; stroke: {{maps.C.done}}; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke"></path>
        <path d="{{maps.routeD}}" style="fill: none; stroke: {{maps.C.halo}}; stroke-width: 11; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .8"></path>
        <path d="{{maps.routeD}}" style="fill: none; stroke: {{maps.C.route}}; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; {{maps.routeDash}}"></path>
      </svg>
    </div>
    <sc-for list="{{maps.labels}}" as="lb" hint-placeholder-count="4">
      <span style="position: absolute; left: {{lb.l}}px; top: {{lb.top}}px; white-space: nowrap; pointer-events: none; transition: left .6s cubic-bezier(.19,1,.22,1), top .6s cubic-bezier(.19,1,.22,1); {{lb.css}}">{{lb.t}}</span>
    </sc-for>
    <sc-for list="{{maps.pins}}" as="pn" hint-placeholder-count="3">
      <button aria-label="{{pn.name}}" onClick="{{pn.tap}}" style="position: absolute; left: {{pn.l}}px; top: {{pn.t}}px; width: {{pn.sz}}px; height: {{pn.sz}}px; margin: {{pn.off}}px 0 0 {{pn.off}}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: left .6s cubic-bezier(.19,1,.22,1), top .6s cubic-bezier(.19,1,.22,1); {{pn.css}}"><svg class="i" viewBox="0 0 24 24" style="width: {{pn.isz}}px; height: {{pn.isz}}px"><path d="{{pn.d}}"></path></svg></button>
    </sc-for>
    <div style="position: absolute; left: {{maps.meL}}px; top: {{maps.meT}}px; width: 0; height: 0; pointer-events: none; transition: left {{maps.meTr}}, top {{maps.meTr}}">
      <span class="ring" style="position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 12px; background: var(--acc)"></span>
      <span style="position: absolute; left: -11px; top: -11px; width: 16px; height: 16px; border-radius: 11px; background: var(--acc); border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,.3)"></span>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 58px; background: linear-gradient({{maps.C.land}}, rgba(0,0,0,0)); pointer-events: none"></div>

  <!-- search -->
  <sc-if value="{{maps.showSearch}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 12px; right: 12px; top: 52px; height: 54px; border-radius: 27px; background: var(--bg); box-shadow: 0 6px 22px var(--shc), 0 0 0 1px var(--line); display: flex; align-items: center; padding: 0 5px; z-index: 3">
      <button class="ib" aria-label="{{maps.searchLabel}}" onClick="{{maps.searchLead}}"><svg class="i" viewBox="0 0 24 24"><path d="{{maps.searchIcon}}"></path></svg></button>
      <input aria-label="Search places" placeholder="Search" value="{{maps.q}}" onChange="{{maps.onQ}}" onClick="{{maps.focusQ}}" onKeyDown="{{maps.qKey}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px; padding: 0 4px">
      <sc-if value="{{maps.hasQ}}" hint-placeholder-val="{{false}}">
        <button class="ib" aria-label="Clear search" onClick="{{maps.clearQ}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{maps.isBase}}" hint-placeholder-val="{{true}}">
    <div class="scr" style="position: absolute; left: 0; right: 0; top: 116px; display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; touch-action: pan-x; z-index: 3">
      <sc-for list="{{maps.chips}}" as="c" hint-placeholder-count="3">
        <button class="tap" onClick="{{c.go}}" style="flex-shrink: 0; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: var(--bg); box-shadow: 0 4px 14px var(--shc), 0 0 0 1px var(--line); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{c.d}}"></path></svg>{{c.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <!-- recenter -->
  <sc-if value="{{maps.showRec}}" hint-placeholder-val="{{true}}">
    <sc-if value="{{maps.isNav}}" hint-placeholder-val="{{false}}">
      <button aria-label="Recenter" onClick="{{maps.recenter}}" style="position: absolute; right: 16px; bottom: 136px; width: 54px; height: 54px; border-radius: 27px; background: #151515; color: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 3; box-shadow: 0 6px 20px rgba(0,0,0,.5)"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.mapsLoc}}"></path></svg></button>
    </sc-if>
    <sc-if value="{{maps.showSearch}}" hint-placeholder-val="{{true}}">
      <button aria-label="Recenter" onClick="{{maps.recenter}}" style="position: absolute; right: 16px; bottom: {{maps.recBottom}}px; width: 50px; height: 50px; border-radius: 25px; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 3; box-shadow: 0 6px 20px var(--shc), 0 0 0 1px var(--line); transition: bottom .45s cubic-bezier(.19,1,.22,1); {{maps.recCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.mapsLoc}}"></path></svg></button>
    </sc-if>
  </sc-if>

  <!-- results sheet -->
  <sc-if value="{{maps.isResults}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{maps.sheetH}}px; border-radius: 28px 28px 0 0; background: var(--bg); box-shadow: 0 -10px 40px var(--shc), 0 -1px 0 var(--line); display: flex; flex-direction: column; z-index: 4; transition: height .45s cubic-bezier(.19,1,.22,1)">
      <button aria-label="Resize results" onPointerDown="{{maps.sheetSw.down}}" onPointerUp="{{maps.sheetSw.up}}" onClick="{{maps.sheetTap}}" style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab"><span style="width: 40px; height: 4px; border-radius: 2px; background: var(--mut); opacity: .45"></span></button>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 0 0 120px; touch-action: pan-y">
        <sc-if value="{{maps.emptyQ}}" hint-placeholder-val="{{false}}">
          <div class="scr" style="display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 14px; touch-action: pan-x">
            <sc-for list="{{maps.cats}}" as="c" hint-placeholder-count="3">
              <button class="tap" onClick="{{c.go}}" style="flex-shrink: 0; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: var(--s2); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{c.d}}"></path></svg>{{c.label}}</button>
            </sc-for>
          </div>
          <sc-for list="{{maps.savedRows}}" as="r" hint-placeholder-count="3">
            <button class="tap" onClick="{{r.go}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 20px">
              <span style="width: 42px; height: 42px; border-radius: 21px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.d}}"></path></svg></span>
              <div style="min-width: 0; text-align: left"><div style="font-size: 16px; font-weight: 600">{{r.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></div>
            </button>
          </sc-for>
        </sc-if>
        <sc-for list="{{maps.results}}" as="r" hint-placeholder-count="3">
          <button class="tap" onClick="{{r.go}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 20px">
            <span style="width: 42px; height: 42px; border-radius: 21px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.d}}"></path></svg></span>
            <div style="min-width: 0; text-align: left"><div style="font-size: 16px; font-weight: 600">{{r.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></div>
          </button>
        </sc-for>
        <sc-if value="{{maps.noResults}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 20px 6px; color: var(--mut)">
            <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{ic.search}}"></path></svg>
            <div style="font-size: 15px">No places</div>
          </div>
          <button class="tap" onClick="{{maps.askAlpha}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 20px">
            <span style="width: 42px; height: 42px; border-radius: 21px; background: var(--s2); color: var(--acct); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 22px"><span class="al">α</span></span>
            <span style="font-size: 16px; font-weight: 600; text-align: left; min-width: 0">{{maps.noResTxt}}</span>
          </button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- place card -->
  <sc-if value="{{maps.isPlace}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{maps.sheetH}}px; border-radius: 28px 28px 0 0; background: var(--bg); box-shadow: 0 -10px 40px var(--shc), 0 -1px 0 var(--line); z-index: 4; padding: 18px 20px 0; box-sizing: border-box">
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <div style="flex-grow: 1; min-width: 0">
          <h1 class="serif" style="margin: 0; font-size: 32px; line-height: 1.1; letter-spacing: -.01em">{{maps.pc.name}}</h1>
          <div style="font-size: 14px; color: var(--mut); margin-top: 6px">{{maps.pc.meta}}</div>
          <sc-if value="{{maps.pc.hasHours}}" hint-placeholder-val="{{true}}">
            <div style="font-size: 14px; margin-top: 4px"><span style="font-weight: 600; {{maps.pc.openCss}}">{{maps.pc.openTxt}}</span><span style="color: var(--mut)"> · {{maps.pc.hoursTxt}}</span></div>
          </sc-if>
        </div>
        <button class="ib" aria-label="Close place" onClick="{{maps.pc.close}}" style="background: var(--s2); margin: -2px -6px 0 0"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 20px; align-items: center">
        <sc-if value="{{maps.pc.canDir}}" hint-placeholder-val="{{true}}">
        <button aria-label="Directions" onClick="{{maps.pc.dirs}}" style="flex-grow: 1; height: 52px; border-radius: 26px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.mapsCar}}"></path></svg>{{maps.pc.min}}</button>
        </sc-if>
        <sc-if value="{{maps.pc.hasPhone}}" hint-placeholder-val="{{true}}">
          <button class="ib" aria-label="Call" onClick="{{maps.pc.call}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--s2)"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.phone}}"></path></svg></button>
        </sc-if>
        <button class="ib" aria-label="{{maps.pc.saveLabel}}" aria-pressed="{{maps.pc.saved}}" onClick="{{maps.pc.save}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--s2); {{maps.pc.starCss}}"><svg class="i" viewBox="0 0 24 24" style="{{maps.pc.starFill}}"><path d="{{ic.star}}"></path></svg></button>
        <button class="ib" aria-label="Share" onClick="{{maps.pc.share}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--s2)"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
        <sc-if value="{{maps.pc.hasWeb}}" hint-placeholder-val="{{true}}">
          <button class="ib" aria-label="Website" onClick="{{maps.pc.web}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--s2)"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.globe}}"></path></svg></button>
        </sc-if>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 14px; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.pin}}"></path></svg>{{maps.pc.addr}}</div>
    </div>
  </sc-if>

  <!-- directions -->
  <sc-if value="{{maps.isDir}}" hint-placeholder-val="{{false}}">
    <div class="drop" style="position: absolute; left: 12px; right: 12px; top: 52px; border-radius: 26px; background: var(--bg); box-shadow: 0 6px 22px var(--shc), 0 0 0 1px var(--line); padding: 6px 12px 12px 4px; z-index: 3">
      <div style="display: flex; align-items: center; gap: 4px">
        <button class="ib" aria-label="Back to place" onClick="{{maps.dr.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: center; gap: 12px; height: 32px; font-size: 15px; color: var(--mut)"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--acc); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--acc); margin: 0 4px; flex-shrink: 0"></span>Your location</div>
          <div style="display: flex; align-items: center; gap: 12px; height: 32px; font-size: 15px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.pin}}"></path></svg>{{maps.dr.name}}</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 8px 0 0 8px">
        <sc-for list="{{maps.dr.modes}}" as="md" hint-placeholder-count="4">
          <button aria-label="{{md.label}}" onClick="{{md.go}}" style="height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; {{md.css}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{md.d}}"></path></svg>{{md.t}}</button>
        </sc-for>
      </div>
    </div>
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{maps.sheetH}}px; border-radius: 28px 28px 0 0; background: var(--bg); box-shadow: 0 -10px 40px var(--shc), 0 -1px 0 var(--line); z-index: 4; padding: 22px 20px 0; box-sizing: border-box">
      <div style="display: flex; align-items: baseline; gap: 12px"><span class="serif" style="font-size: 44px; line-height: 1">{{maps.dr.min}}</span><span style="font-size: 15px; color: var(--mut)">{{maps.dr.meta}}</span></div>
      <div style="font-size: 14px; color: var(--mut); margin-top: 8px">{{maps.dr.via}}</div>
      <div style="display: flex; gap: 8px; margin-top: 20px">
        <button onClick="{{maps.dr.start}}" style="flex-grow: 1; height: 56px; border-radius: 28px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="fill: currentColor"><path d="{{ic.mapsNav}}"></path></svg>Start</button>
        <button class="ib" aria-label="{{maps.dr.shareLabel}}" onClick="{{maps.dr.shareEta}}" style="width: 56px; height: 56px; border-radius: 28px; background: var(--s2)"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
      </div>
    </div>
  </sc-if>

  <!-- navigation (immersive) -->
  <sc-if value="{{maps.isNav}}" hint-placeholder-val="{{false}}">
    <div class="drop" style="position: absolute; left: 12px; right: 12px; top: 50px; border-radius: 28px; background: var(--acc); color: #ffffff; padding: 18px 20px; display: flex; align-items: center; gap: 16px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.5)">
      <sc-if value="{{maps.dr.nav.going}}" hint-placeholder-val="{{true}}">
        <svg class="i" viewBox="0 0 24 24" style="width: 52px; height: 52px; stroke-width: 2"><path d="{{maps.dr.nav.icon}}"></path></svg>
      </sc-if>
      <sc-if value="{{maps.dr.nav.arrived}}" hint-placeholder-val="{{false}}">
        <svg class="i" viewBox="0 0 24 24" style="width: 52px; height: 52px; stroke-width: 2"><path d="{{ic.check}}"></path></svg>
      </sc-if>
      <div style="min-width: 0">
        <div class="serif" style="font-size: 40px; line-height: 1">{{maps.dr.nav.dist}}</div>
        <div style="font-size: 19px; font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{maps.dr.nav.street}}</div>
      </div>
    </div>
    <sc-if value="{{maps.dr.nav.hasThen}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 28px; top: 158px; height: 40px; padding: 0 14px; border-radius: 0 0 16px 16px; background: #0000B8; color: #ffffff; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; z-index: 4">Then<svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{maps.dr.nav.thenD}}"></path></svg></div>
    </sc-if>
    <div class="enter" style="position: absolute; left: 12px; right: 12px; bottom: 26px; border-radius: 32px; background: #151515; color: #ffffff; padding: 10px; display: flex; align-items: center; gap: 12px; z-index: 5">
      <button aria-label="End navigation" onClick="{{maps.dr.nav.end}}" style="width: 56px; height: 56px; border-radius: 28px; background: #262626; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button>
      <div style="flex-grow: 1; min-width: 0; text-align: center">
        <div class="serif" style="font-size: 30px; line-height: 1.05">{{maps.dr.nav.left}}</div>
        <div style="font-size: 13px; color: #8F8F8F; margin-top: 3px">{{maps.dr.nav.meta}}</div>
      </div>
      <button aria-label="Ask {{name}}" onClick="{{maps.dr.nav.ask}}" style="width: 56px; height: 56px; border-radius: 28px; background: #262626; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 24px"><span class="al">α</span></button>
      <button aria-label="{{maps.dr.nav.voiceLabel}}" onClick="{{maps.dr.nav.voice}}" style="width: 56px; height: 56px; border-radius: 28px; background: #262626; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="{{maps.dr.nav.voiceD}}"></path></svg></button>
    </div>
  </sc-if>
</div>
