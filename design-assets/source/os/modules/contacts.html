<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-if value="{{contacts.notSearching}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
      <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Contacts</h1>
      <button class="ib" aria-label="Search contacts" onClick="{{contacts.openSearch}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.search}}"></path></svg></button>
      <button class="ib" aria-label="New contact" onClick="{{contacts.addNew}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.plus}}"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{contacts.searching}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 16px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 4px 0 16px; border-radius: 23px; background: var(--s2)">
        <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.search}}"></path></svg>
        <input ref="{{contacts.searchRef}}" aria-label="Search contacts" placeholder="Search" value="{{contacts.q}}" onChange="{{contacts.onQ}}" style="flex-grow: 1; min-width: 0; height: 44px; background: transparent; border: 0; outline: none; color: var(--fg); font-size: 16px">
        <button class="ib" aria-label="Close search" onClick="{{contacts.closeSearch}}" style="width: 40px; height: 40px"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
      </div>
    </div>
  </sc-if>
  <div class="scr" style="flex-grow: 1; overflow-y: auto; padding-bottom: 130px; touch-action: pan-y">
    <sc-if value="{{contacts.hasFavs}}" hint-placeholder-val="{{true}}">
      <div class="scr" style="display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 10px; touch-action: pan-x">
        <sc-for list="{{contacts.favs}}" as="f" hint-placeholder-count="4">
          <button aria-label="{{f.label}}" onClick="{{f.open}}" style="flex-shrink: 0; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 7px">
            <span style="width: 60px; height: 60px; border-radius: 30px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">{{f.ini}}</span>
            <span style="font-size: 13px; max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.first}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-for list="{{contacts.groups}}" as="g" hint-placeholder-count="4">
      <div>
        <div style="padding: 14px 24px 2px; font-size: 13px; font-weight: 600; color: var(--mut)">{{g.letter}}</div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <button class="tap" onClick="{{r.open}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 8px 24px; text-align: left; box-sizing: border-box">
            <span style="width: 40px; height: 40px; border-radius: 20px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0">{{r.ini}}</span>
            <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
    <sc-if value="{{contacts.noHits}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 64px; color: var(--mut)">
        <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 1.4"><path d="{{ic.user}}"></path></svg>
        <span style="font-size: 15px">No matches</span>
        <button onClick="{{contacts.addNew}}" aria-label="Add {{contacts.qRaw}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px 0 12px; border-radius: 18px; background: var(--s2); color: var(--fg); font-size: 14px; font-weight: 600; margin-top: 4px">
          <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="{{ic.plus}}"></path></svg><span>Add ‘{{contacts.qRaw}}’</span>
        </button>
      </div>
    </sc-if>
    <sc-if value="{{contacts.hasQ}}" hint-placeholder-val="{{false}}">
      <button class="tap" onClick="{{contacts.askQ}}" aria-label="Ask {{name}}: {{contacts.qRaw}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 8px 24px; margin-top: 8px; text-align: left; box-sizing: border-box">
        <span style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 22px; color: var(--acct); flex-shrink: 0"><span class="al">α</span></span>
        <span style="font-size: 15px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ask {{name}}: ‘{{contacts.qRaw}}’</span>
      </button>
    </sc-if>
  </div>

  <!-- DETAIL -->
  <sc-if value="{{contacts.detail}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to contacts" onClick="{{contacts.d.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button class="ib" aria-label="{{contacts.d.favLabel}}" aria-pressed="{{contacts.d.fav}}" onClick="{{contacts.d.toggleFav}}"><svg class="i" viewBox="0 0 24 24" style="{{contacts.d.favCss}}"><path d="{{ic.star}}"></path></svg></button>
        <button class="ib" aria-label="Edit contact" onClick="{{contacts.d.edit}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.edit}}"></path></svg></button>
        <button class="ib" aria-label="Delete contact" onClick="{{contacts.d.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 8px 0 130px; touch-action: pan-y">
        <div style="display: flex; flex-direction: column; align-items: center; padding: 0 24px">
          <span class="serif" style="width: 112px; height: 112px; border-radius: 56px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 42px">{{contacts.d.ini}}</span>
          <h1 class="serif" style="margin: 16px 0 0; font-size: 34px; line-height: 1.1; text-align: center; letter-spacing: -.01em">{{contacts.d.name}}</h1>
          <sc-if value="{{contacts.d.hasActs}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; gap: 14px; margin-top: 22px">
              <sc-for list="{{contacts.d.acts}}" as="a" hint-placeholder-count="4">
                <button aria-label="{{a.label}}" onClick="{{a.go}}" class="tap" style="width: 60px; height: 60px; border-radius: 30px; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{a.d}}"></path></svg></button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <sc-if value="{{contacts.d.hasFields}}" hint-placeholder-val="{{true}}">
          <div style="margin: 28px 16px 0; padding: 6px 0; border-radius: 26px; background: var(--s2)">
            <sc-for list="{{contacts.d.fields}}" as="f" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 16px; min-height: 54px; padding: 8px 20px; box-sizing: border-box">
                <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--mut)"><path d="{{f.d}}"></path></svg>
                <span style="font-size: 16px; line-height: 1.35; user-select: text; min-width: 0; overflow-wrap: anywhere">{{f.v}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{contacts.d.hasCtx}}" hint-placeholder-val="{{true}}">
          <button onClick="{{contacts.d.ask}}" class="tap" aria-label="Ask {{name}} about {{contacts.d.name}}" style="margin: 12px 16px 0; width: calc(100% - 32px); display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 16px 20px; border-radius: 26px; box-shadow: inset 0 0 0 1px var(--line); text-align: left; box-sizing: border-box">
            <span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.1; color: var(--acct)"><span class="al">α</span></span>
            <span style="flex-grow: 1; font-size: 15px; line-height: 1.45">{{contacts.d.ctx}}</span>
            <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--mut); margin-top: 3px"><path d="{{ic.right}}"></path></svg>
          </button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- EDIT / ADD -->
  <sc-if value="{{contacts.editing}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 5">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 12px 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Cancel" onClick="{{contacts.cancelEdit}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Save" aria-disabled="{{contacts.cantSave}}" onClick="{{contacts.save}}" style="height: 36px; padding: 0 18px; border-radius: 18px; font-size: 15px; font-weight: 600; transition: background .2s; {{contacts.saveCss}}">Save</button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 140px; touch-action: pan-y">
        <div style="display: flex; justify-content: center; margin-bottom: 22px">
          <span class="serif" style="width: 88px; height: 88px; border-radius: 44px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 34px; color: var(--fg)">
            <sc-if value="{{contacts.eHasIni}}" hint-placeholder-val="{{true}}">{{contacts.eIni}}</sc-if>
            <sc-if value="{{contacts.eNoIni}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 36px; height: 36px; color: var(--mut); stroke-width: 1.3"><path d="{{ic.user}}"></path></svg></sc-if>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{contacts.nameInputs}}" as="f" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px 0 18px; border-radius: 16px; background: var(--s2)">
              <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--mut)"><path d="{{f.d}}"></path></svg>
              <input aria-label="{{f.ph}}" placeholder="{{f.ph}}" value="{{f.v}}" onChange="{{f.change}}" style="flex-grow: 1; min-width: 0; height: 50px; background: transparent; border: 0; outline: none; color: var(--fg); font-size: 16px">
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px">
          <sc-for list="{{contacts.inputs}}" as="f" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px 0 18px; border-radius: 16px; background: var(--s2)">
              <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--mut)"><path d="{{f.d}}"></path></svg>
              <input aria-label="{{f.ph}}" placeholder="{{f.ph}}" type="{{f.type}}" value="{{f.v}}" onChange="{{f.change}}" style="flex-grow: 1; min-width: 0; height: 50px; background: transparent; border: 0; outline: none; color: var(--fg); font-size: 16px">
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

</div>
