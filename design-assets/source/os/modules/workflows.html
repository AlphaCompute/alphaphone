<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
    <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Workflows</h1>
    <button class="ib" aria-label="New workflow" onClick="{{workflows.newFlow}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.plus}}"></path></svg></button>
  </div>
  <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 8px 16px 120px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y">
    <sc-for list="{{workflows.cards}}" as="f" hint-placeholder-count="4">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 18px 16px 18px 20px; border-radius: 24px; background: var(--s2); flex-shrink: 0">
        <button onClick="{{f.open}}" style="flex-grow: 1; min-width: 0; text-align: left; {{f.dim}}">
          <div style="font-size: 17px; font-weight: 600">{{f.name}}</div>
          <div style="font-size: 14px; color: var(--mut); margin-top: 5px; line-height: 1.45; display: flex; gap: 6px; align-items: flex-start; text-wrap: pretty">
            <sc-if value="{{f.failed}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--fg); flex-shrink: 0; margin-top: 2px"><path d="{{ic.info}}"></path></svg></sc-if>
            <span>{{f.short}}</span>
          </div>
        </button>
        <button aria-label="Turn {{f.name}} on or off" aria-pressed="{{f.on}}" onClick="{{f.toggle}}" style="position: relative; width: 52px; height: 32px; border-radius: 16px; flex-shrink: 0; transition: background .25s; {{f.track}}">
          <span style="position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.19,1,.22,1); transform: translateX({{f.kx}}px)"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <!-- detail -->
  <sc-if value="{{workflows.detail}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to workflows" onClick="{{workflows.fd.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button class="ib" aria-label="Delete workflow" onClick="{{workflows.fd.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
        <button aria-label="Turn {{workflows.fd.name}} on or off" aria-pressed="{{workflows.fd.on}}" onClick="{{workflows.fd.toggle}}" style="position: relative; width: 52px; height: 32px; border-radius: 16px; margin: 0 12px 0 6px; transition: background .25s; {{workflows.fd.track}}">
          <span style="position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.19,1,.22,1); transform: translateX({{workflows.fd.kx}}px)"></span>
        </button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 130px; touch-action: pan-y">
        <h1 class="serif" style="margin: 0; font-size: 38px; line-height: 1.05; letter-spacing: -.01em">{{workflows.fd.name}}</h1>
        <div style="font-size: 17px; line-height: 1.55; margin-top: 14px; text-wrap: pretty">{{workflows.fd.summary}}</div>
        <sc-if value="{{workflows.fd.hasApps}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px">
            <sc-for list="{{workflows.fd.apps}}" as="a" hint-placeholder-count="2">
              <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 15px; background: var(--s2); font-size: 12.5px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="{{a.d}}"></path></svg>{{a.name}}</span>
            </sc-for>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; margin-top: 26px">
          <sc-for list="{{workflows.fd.steps}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; gap: 14px">
              <div style="display: flex; flex-direction: column; align-items: center; width: 32px; flex-shrink: 0">
                <span aria-label="{{s.label}}" style="width: 32px; height: 32px; border-radius: 16px; margin-top: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .2s; {{s.dotCss}}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="{{s.d}}"></path></svg></span>
                <span style="width: 2px; flex-grow: 1; background: {{s.lineColor}}"></span>
              </div>
              <div style="flex-grow: 1; padding: 16px; border-radius: 18px; margin-bottom: 10px; font-size: 15.5px; line-height: 1.4; transition: box-shadow .2s; {{s.boxCss}}">{{s.t}}</div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px">
          <span style="flex-grow: 1; font-size: 13px; color: var(--mut)">{{workflows.fd.last}}</span>
          <button onClick="{{workflows.fd.edit}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: var(--s2); font-weight: 600; font-size: 14px">Change</button>
          <sc-if value="{{workflows.fd.notRunning}}" hint-placeholder-val="{{true}}">
            <button aria-label="Run now" onClick="{{workflows.fd.run}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: var(--acc); color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: currentColor"><path d="{{ic.play}}"></path></svg>Run</button>
          </sc-if>
          <sc-if value="{{workflows.fd.isRunning}}" hint-placeholder-val="{{false}}">
            <span style="height: 44px; width: 44px; border-radius: 22px; background: var(--acc); display: flex; align-items: center; justify-content: center"><span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #fff"></span></span>
          </sc-if>
        </div>

        <sc-if value="{{workflows.fd.hasRuns}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; margin-top: 26px; border-top: 1px solid var(--line); padding-top: 8px">
            <sc-for list="{{workflows.fd.runs}}" as="r" hint-placeholder-count="3">
              <button onClick="{{r.open}}" aria-label="{{r.label}}" style="display: flex; align-items: center; gap: 14px; min-height: 60px; text-align: left">
                <span style="width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{r.css}}"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.4"><path d="{{r.d}}"></path></svg></span>
                <span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 15px">{{r.when}}</span><span style="display: block; font-size: 13px; color: var(--mut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sum}}</span></span>
                <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut); flex-shrink: 0"><path d="{{ic.right}}"></path></svg>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- run detail -->
  <sc-if value="{{workflows.runOpen}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 5">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to {{workflows.r.flow}}" onClick="{{workflows.r.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 130px; touch-action: pan-y">
        <h1 class="serif" style="margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: -.01em">{{workflows.r.when}}</h1>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 15px">
          <span style="width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; {{workflows.r.scss}}"><svg class="i" viewBox="0 0 24 24" style="width: 13px; height: 13px; stroke-width: 2.6"><path d="{{workflows.r.sd}}"></path></svg></span>
          <span style="font-weight: 600">{{workflows.r.status}}</span><span style="color: var(--mut)">{{workflows.r.flow}}</span>
        </div>

        <sc-if value="{{workflows.r.hasOut}}" hint-placeholder-val="{{true}}">
          <div class="serif" style="margin-top: 22px; padding: 18px 20px; border-radius: 24px; background: var(--s2); font-size: 20px; line-height: 1.35">{{workflows.r.out}}</div>
        </sc-if>
        <sc-if value="{{workflows.r.hasFix}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 22px; padding: 16px 18px; border-radius: 24px; background: var(--s2); display: flex; gap: 12px; font-size: 15px; line-height: 1.45">
            <span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.1; color: var(--acct); flex-shrink: 0"><span class="al">α</span></span><span>{{workflows.r.fix}}</span>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; margin-top: 26px">
          <sc-for list="{{workflows.r.log}}" as="l" hint-placeholder-count="4">
            <div style="display: flex; gap: 14px">
              <div style="display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0">
                <span style="width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{l.css}}"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 2.4"><path d="{{l.d}}"></path></svg></span>
                <span style="width: 2px; flex-grow: 1; min-height: 12px; background: {{l.line}}"></span>
              </div>
              <div style="flex-grow: 1; display: flex; gap: 10px; padding: 3px 0 20px">
                <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--mut); flex-shrink: 0; margin-top: 3px"><path d="{{l.kd}}"></path></svg>
                <div style="font-size: 15.5px; line-height: 1.45; {{l.tcss}}">{{l.t}}</div>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
          <button onClick="{{workflows.r.ask}}" aria-label="Ask {{name}} about this run" style="height: 36px; padding: 0 16px 0 14px; border-radius: 18px; background: var(--s2); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px"><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 19px; line-height: 1; color: var(--acct)"><span class="al">α</span></span>Explain</button>
          <span style="flex-grow: 1"></span>
          <button aria-label="Run again" onClick="{{workflows.r.again}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: var(--acc); color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: currentColor"><path d="{{ic.play}}"></path></svg>Run again</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- builder -->
  <sc-if value="{{workflows.builder}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 6">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to workflows" onClick="{{workflows.b.cancel}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Save workflow" aria-disabled="{{workflows.b.saveOff}}" onClick="{{workflows.b.save}}" style="height: 36px; padding: 0 18px; border-radius: 18px; font-weight: 600; font-size: 15px; {{workflows.b.saveCss}}">Save</button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 130px; touch-action: pan-y">
        <input value="{{workflows.b.name}}" onChange="{{workflows.b.onName}}" placeholder="Name" aria-label="Workflow name" class="serif" style="width: 100%; font-size: 34px; border: none; outline: none; background: transparent; color: var(--fg); padding: 6px 0; letter-spacing: -.01em">

        <div style="display: flex; flex-direction: column; margin-top: 20px">
          <sc-for list="{{workflows.b.steps}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; gap: 14px">
              <div style="display: flex; flex-direction: column; align-items: center; width: 32px; flex-shrink: 0">
                <span style="width: 32px; height: 32px; border-radius: 16px; margin-top: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; {{s.dotCss}}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="{{s.d}}"></path></svg></span>
                <span style="width: 2px; flex-grow: 1; background: var(--line)"></span>
              </div>
              <button onClick="{{s.tap}}" aria-label="Edit {{s.k}} step" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 16px 14px 16px 16px; border-radius: 18px; margin-bottom: 10px; text-align: left; {{s.boxCss}}">
                <span style="flex-grow: 1; min-width: 0; font-size: 15.5px; line-height: 1.4">{{s.t}}</span>
                <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; opacity: .5; flex-shrink: 0"><path d="{{ic.edit}}"></path></svg>
              </button>
            </div>
          </sc-for>
          <div style="display: flex; gap: 14px">
            <div style="display: flex; flex-direction: column; align-items: center; width: 32px; flex-shrink: 0">
              <span style="width: 32px; height: 32px; border-radius: 16px; margin-top: 12px; border: 1.5px dashed var(--mut); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="{{ic.plus}}"></path></svg></span>
            </div>
            <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px; padding: 4px 0">
              <sc-for list="{{workflows.b.palette}}" as="p" hint-placeholder-count="7">
                <button onClick="{{p.add}}" aria-label="{{p.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px">
                  <span class="tap" style="width: 48px; height: 48px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{p.d}}"></path></svg></span>
                  <span style="font-size: 11.5px; color: var(--mut)">{{p.k}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </div>

        <sc-if value="{{workflows.b.hasApps}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line)">
            <sc-for list="{{workflows.b.apps}}" as="a" hint-placeholder-count="2">
              <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 15px; background: var(--s2); font-size: 12.5px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="{{a.d}}"></path></svg>{{a.name}}</span>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{workflows.b.empty}}" hint-placeholder-val="{{true}}">
          <button onClick="{{workflows.b.describe}}" aria-label="Describe it to {{name}}" style="display: flex; align-items: center; gap: 8px; margin-top: 26px; height: 36px; padding: 0 16px 0 14px; border-radius: 18px; background: var(--s2); font-size: 14px; font-weight: 600">
            <span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 19px; line-height: 1; color: var(--acct)"><span class="al">α</span></span>Describe it
          </button>
        </sc-if>
      </div>

      <sc-if value="{{workflows.b.sheetOn}}" hint-placeholder-val="{{false}}">
        <button aria-label="Close" onClick="{{workflows.b.closeSheet}}" style="position: absolute; inset: 0; background: var(--scrim); z-index: 8"></button>
        <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 20px 32px; box-shadow: 0 -12px 30px var(--shc); max-height: 720px; overflow-y: auto; box-sizing: border-box">
          <div style="display: flex; justify-content: center; padding-bottom: 6px"><span style="width: 36px; height: 4px; border-radius: 2px; background: var(--line)"></span></div>

          <sc-if value="{{workflows.b.isTrig}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; justify-content: space-between; padding: 6px 0 4px">
              <sc-for list="{{workflows.b.tr.kinds}}" as="k" hint-placeholder-count="5">
                <button onClick="{{k.pick}}" aria-label="{{k.label}} trigger" aria-pressed="{{k.pressed}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px">
                  <span style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; {{k.css}}"><svg class="i" viewBox="0 0 24 24"><path d="{{k.d}}"></path></svg></span>
                  <span style="font-size: 11.5px; color: var(--mut)">{{k.label}}</span>
                </button>
              </sc-for>
            </div>
            <div class="serif" style="font-size: 26px; line-height: 1.2; margin: 18px 4px 16px">{{workflows.b.tr.text}}</div>
            <sc-if value="{{workflows.b.tr.isTime}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{workflows.b.tr.days}}" as="c" hint-placeholder-count="5">
                  <button onClick="{{c.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; font-size: 13.5px; font-weight: 600; {{c.css}}">{{c.label}}</button>
                </sc-for>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; margin-top: 14px">
                <svg class="i" viewBox="0 0 24 24" style="color: var(--mut)"><path d="{{ic.clock}}"></path></svg>
                <span style="flex-grow: 1; font-size: 19px; font-weight: 600">{{workflows.b.tr.time}}</span>
                <button class="ib" aria-label="Earlier" onClick="{{workflows.b.tr.tMinus}}" style="background: var(--s2)"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.minus}}"></path></svg></button>
                <button class="ib" aria-label="Later" onClick="{{workflows.b.tr.tPlus}}" style="background: var(--s2)"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.plus}}"></path></svg></button>
              </div>
            </sc-if>
            <sc-if value="{{workflows.b.tr.isEvent}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{workflows.b.tr.evs}}" as="c" hint-placeholder-count="3">
                  <button onClick="{{c.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; font-size: 13.5px; font-weight: 600; {{c.css}}">{{c.label}}</button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{workflows.b.tr.isPlace}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{workflows.b.tr.places}}" as="c" hint-placeholder-count="3">
                  <button onClick="{{c.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; font-size: 13.5px; font-weight: 600; {{c.css}}">{{c.label}}</button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{workflows.b.tr.isMsg}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-wrap: wrap; gap: 10px">
                <sc-for list="{{workflows.b.tr.people}}" as="p" hint-placeholder-count="6">
                  <button onClick="{{p.pick}}" aria-label="{{p.first}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 48px">
                    <span style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; {{p.css}}">{{p.ini}}</span>
                    <span style="font-size: 11px; color: var(--mut)">{{p.first}}</span>
                  </button>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{workflows.b.tr.isEmail}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 16px; background: var(--s2)">
                <svg class="i" viewBox="0 0 24 24" style="color: var(--mut)"><path d="{{ic.search}}"></path></svg>
                <input value="{{workflows.b.tr.match}}" onChange="{{workflows.b.tr.onMatch}}" placeholder="Words to match" aria-label="Words to match" style="flex-grow: 1; min-width: 0; font-size: 16px; border: none; outline: none; background: transparent; color: var(--fg); height: 44px">
              </div>
            </sc-if>
            <button onClick="{{workflows.b.closeSheet}}" style="width: 100%; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: var(--acc); color: #fff; font-weight: 600; font-size: 15px; margin-top: 22px">Done</button>
          </sc-if>

          <sc-if value="{{workflows.b.isStep}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 4px; padding: 4px 0 8px">
              <span style="width: 36px; height: 36px; border-radius: 18px; background: var(--acct); color: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{workflows.b.sp.d}}"></path></svg></span>
              <span class="serif" style="flex-grow: 1; font-size: 26px; margin-left: 12px">{{workflows.b.sp.k}}</span>
              <button class="ib" aria-label="Move step up" onClick="{{workflows.b.sp.up}}" style="{{workflows.b.sp.upCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.wfUp}}"></path></svg></button>
              <button class="ib" aria-label="Move step down" onClick="{{workflows.b.sp.down}}" style="{{workflows.b.sp.downCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.wfDown}}"></path></svg></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
              <sc-for list="{{workflows.b.sp.presets}}" as="c" hint-placeholder-count="4">
                <button onClick="{{c.pick}}" style="min-height: 48px; padding: 10px 18px; border-radius: 24px; text-align: left; font-size: 15px; {{c.css}}">{{c.label}}</button>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 16px; margin-top: 10px; background: var(--s2)">
              <svg class="i" viewBox="0 0 24 24" style="color: var(--mut)"><path d="{{ic.edit}}"></path></svg>
              <input value="{{workflows.b.sp.text}}" onChange="{{workflows.b.sp.onText}}" placeholder="In your words" aria-label="Step text" style="flex-grow: 1; min-width: 0; font-size: 16px; border: none; outline: none; background: transparent; color: var(--fg); height: 44px">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 18px">
              <button onClick="{{workflows.b.sp.del}}" aria-label="Delete step" style="flex: 1; height: 48px; border-radius: 24px; background: var(--s2); color: var(--fg); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.trash}}"></path></svg>Delete</button>
              <button onClick="{{workflows.b.closeSheet}}" style="flex: 1; height: 48px; border-radius: 24px; background: var(--acc); color: #fff; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Done</button>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </sc-if>

</div>
