<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-if value="{{inbox.notSearching}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
      <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Inbox</h1>
      <button class="ib" aria-label="Search email" onClick="{{inbox.openSearch}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.search}}"></path></svg></button>
      <button class="ib" aria-label="Compose" onClick="{{inbox.compose}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.plus}}"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{inbox.searching}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 4px 0 16px; border-radius: 24px; background: var(--s2)">
        <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.search}}"></path></svg>
        <input aria-label="Search mail" placeholder="Search mail" value="{{inbox.q}}" onChange="{{inbox.onQ}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; padding: 0; background: transparent; color: var(--fg); font-size: 16px">
        <button class="ib" aria-label="Close search" onClick="{{inbox.closeSearch}}" style="width: 40px; height: 40px"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
      </div>
    </div>
  </sc-if>
  <div class="scr" style="display: flex; gap: 8px; padding: 6px 20px 10px; flex-shrink: 0; overflow-x: auto; touch-action: pan-x">
    <sc-for list="{{inbox.chips}}" as="f" hint-placeholder-count="4">
      <button aria-label="{{f.label}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; {{f.css}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div class="scr" style="flex-grow: 1; overflow-y: auto; padding-bottom: 120px; touch-action: pan-y">
    <sc-for list="{{inbox.rows}}" as="it" hint-placeholder-count="6">
      <div onPointerDown="{{it.down}}" onPointerUp="{{it.up}}" style="position: relative; overflow: hidden; touch-action: pan-y">
        <div style="position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; background: var(--s2); color: var(--mut)">
          <svg class="i" viewBox="0 0 24 24" style="color: var(--acct)"><path d="{{ic.reply}}"></path></svg>
          <svg class="i" viewBox="0 0 24 24"><path d="{{ic.archive}}"></path></svg>
        </div>
        <button aria-label="{{it.label}}" onClick="{{it.open}}" style="position: relative; width: 100%; display: flex; gap: 14px; padding: 13px 20px; align-items: flex-start; background: var(--bg); transform: translateX({{it.tx}}px); transition: transform .28s cubic-bezier(.19,1,.22,1); box-sizing: border-box">
          <span style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--s2)">{{it.ini}}</span>
          <div style="flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="font-weight: {{it.nameW}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
              <span style="flex-grow: 1"></span>
              <sc-if value="{{it.clip}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--mut)"><path d="{{ic.inboxClip}}"></path></svg></sc-if>
              <span style="font-size: 12px; color: var(--mut); white-space: nowrap">{{it.time}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
              <span style="flex-grow: 1; min-width: 0; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{it.subjCss}}">{{it.subj}}</span>
              <span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{it.dot}}"></span>
            </div>
            <div style="font-size: 13.5px; color: var(--mut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.snip}}</div>
          </div>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{inbox.empty}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 110px; color: var(--mut)">
        <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{inbox.emptyIcon}}"></path></svg>
        <span style="font-size: 15px">{{inbox.emptyText}}</span>
        <sc-if value="{{inbox.emptyAdd}}" hint-placeholder-val="{{false}}">
          <button onClick="{{inbox.addAcct}}" style="height: 36px; padding: 0 16px; border-radius: 18px; background: var(--s2); color: var(--fg); font-size: 14px; font-weight: 600; margin-top: 4px">Add account</button>
        </sc-if>
      </div>
    </sc-if>
    <sc-if value="{{inbox.hasQ}}" hint-placeholder-val="{{false}}">
      <button class="tap" onClick="{{inbox.askQ}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 20px; box-sizing: border-box">
        <span style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; background: var(--s2); color: var(--acct); display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 22px"><span class="al">α</span></span>
        <span style="font-size: 15px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ask {{name}}: “{{inbox.q}}”</span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{inbox.detail}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to inbox" onClick="{{back}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button class="ib" aria-label="Reply" onClick="{{inbox.d.reply}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.reply}}"></path></svg></button>
        <button class="ib" aria-label="Forward" onClick="{{inbox.d.forward}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.inboxFwd}}"></path></svg></button>
        <sc-if value="{{inbox.d.canArchive}}" hint-placeholder-val="{{true}}">
          <button class="ib" aria-label="Archive" onClick="{{inbox.d.archive}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.archive}}"></path></svg></button>
        </sc-if>
        <button class="ib" aria-label="Delete" onClick="{{inbox.d.del}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 130px; touch-action: pan-y">
        <h1 class="serif" style="margin: 0; font-size: 32px; line-height: 1.1; letter-spacing: -.01em">{{inbox.d.subj}}</h1>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 20px">
          <sc-if value="{{inbox.d.hasPerson}}" hint-placeholder-val="{{true}}">
            <button aria-label="{{inbox.d.name}}" onClick="{{inbox.d.who}}" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--s2)">{{inbox.d.ini}}</button>
          </sc-if>
          <sc-if value="{{inbox.d.noPerson}}" hint-placeholder-val="{{false}}">
            <span style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--s2)">{{inbox.d.ini}}</span>
          </sc-if>
          <div style="min-width: 0">
            <div style="font-weight: 600; font-size: 16px">{{inbox.d.name}}</div>
            <div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{inbox.d.meta}}</div>
          </div>
        </div>
        <div style="font-size: 16px; line-height: 1.6; margin-top: 22px; white-space: pre-wrap">{{inbox.d.body}}</div>
        <sc-if value="{{inbox.d.hasAtt}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 22px">
            <sc-for list="{{inbox.d.atts}}" as="a" hint-placeholder-count="1">
              <button onClick="{{a.open}}" aria-label="Open {{a.name}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 18px 12px 14px; border-radius: 22px; background: var(--s2); max-width: 100%; box-sizing: border-box">
                <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--acct); flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.notes}}"></path></svg></span>
                <span style="min-width: 0; display: flex; flex-direction: column">
                  <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span>
                  <span style="font-size: 12.5px; color: var(--mut)">{{a.size}}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{inbox.d.canAsk}}" hint-placeholder-val="{{true}}">
          <button onClick="{{inbox.d.ask}}" style="margin-top: 26px; height: 36px; padding: 0 16px 0 14px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="color: var(--acct); font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 19px; line-height: 1"><span class="al">α</span></span>Draft reply</button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{inbox.composing}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 5">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 12px 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Discard draft" onClick="{{back}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Send email" onClick="{{inbox.c.send}}" style="width: 44px; height: 44px; border-radius: 22px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.send}}"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; padding: 0 20px">
        <sc-if value="{{inbox.c.multi}}" hint-placeholder-val="{{true}}">
          <button aria-label="From account" onClick="{{inbox.c.cycleFrom}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--mut)">
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{inbox.c.from}}</span>
            <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="{{ic.down}}"></path></svg>
          </button>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--line); box-sizing: border-box">
          <sc-for list="{{inbox.c.chips}}" as="r" hint-placeholder-count="1">
            <button aria-label="Remove {{r.name}}" onClick="{{r.rm}}" style="height: 34px; padding: 0 8px 0 14px; border-radius: 17px; background: var(--s2); display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600">{{r.name}}<svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--mut)"><path d="{{ic.x}}"></path></svg></button>
          </sc-for>
          <input aria-label="To" placeholder="{{inbox.c.toPh}}" value="{{inbox.c.toQ}}" onChange="{{inbox.c.onTo}}" onKeyDown="{{inbox.c.toKey}}" style="flex-grow: 1; min-width: 80px; height: 38px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px; padding: 0">
        </div>
        <sc-if value="{{inbox.c.hasRaw}}" hint-placeholder-val="{{false}}">
          <button onClick="{{inbox.c.addRaw}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 15px"><span style="width: 36px; height: 36px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.mail}}"></path></svg></span>{{inbox.c.rawAddr}}</button>
        </sc-if>
        <sc-if value="{{inbox.c.hasSugg}}" hint-placeholder-val="{{false}}">
          <div class="scr" style="display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid var(--line); max-height: 330px; overflow-y: auto; flex-shrink: 0">
            <sc-for list="{{inbox.c.sugg}}" as="p" hint-placeholder-count="4">
              <button class="tap" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 7px 4px; border-radius: 14px">
                <span style="width: 38px; height: 38px; border-radius: 19px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0">{{p.ini}}</span>
                <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px">{{p.name}}</span><span style="font-size: 13px; color: var(--mut)">{{p.email}}</span></span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <input aria-label="Subject" placeholder="Subject" value="{{inbox.c.subject}}" onChange="{{inbox.c.onSubj}}" style="height: 52px; border: 0; border-bottom: 1px solid var(--line); outline: 0; background: transparent; color: var(--fg); font-size: 17px; font-weight: 600; flex-shrink: 0; padding: 0">
        <sc-if value="{{inbox.c.hasAtts}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 0; flex-shrink: 0">
            <sc-for list="{{inbox.c.atts}}" as="a" hint-placeholder-count="1">
              <button aria-label="Remove {{a.name}}" onClick="{{a.rm}}" style="height: 36px; padding: 0 10px 0 12px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; max-width: 100%"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--acct)"><path d="{{ic.inboxClip}}"></path></svg><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--mut)"><path d="{{ic.x}}"></path></svg></button>
            </sc-for>
          </div>
        </sc-if>
        <textarea aria-label="Message" placeholder="Message" value="{{inbox.c.body}}" onChange="{{inbox.c.onBody}}" style="flex-grow: 1; min-height: 120px; border: 0; outline: 0; resize: none; background: transparent; color: var(--fg); font: inherit; font-size: 16px; line-height: 1.55; padding: 14px 0 40px"></textarea>
      </div>
    </div>
  </sc-if>

</div>
