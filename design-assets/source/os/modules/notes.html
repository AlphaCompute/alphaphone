<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-if value="{{notes.notSearching}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
      <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Notes</h1>
      <button class="ib" aria-label="Record and transcribe" onClick="{{notes.record}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.notesWave}}"></path></svg></button>
      <button class="ib" aria-label="New note" onClick="{{notes.newNote}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.plus}}"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{notes.searching}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 12px; gap: 4px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: var(--s2)">
        <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.search}}"></path></svg>
        <input aria-label="Search notes" placeholder="Search" value="{{notes.q}}" onChange="{{notes.onQ}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px">
      </div>
      <button class="ib" aria-label="Close search" onClick="{{notes.endSearch}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button>
    </div>
  </sc-if>

  <div class="scr" style="flex-grow: 1; overflow-y: auto; touch-action: pan-y; padding: 8px 16px 190px; box-sizing: border-box">
    <sc-if value="{{notes.notSearching}}" hint-placeholder-val="{{true}}">
      <button onClick="{{notes.search}}" aria-label="Search notes" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 48px; padding: 0 16px; margin-bottom: 12px; border-radius: 24px; background: var(--s2); color: var(--mut); font-size: 16px; box-sizing: border-box"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.search}}"></path></svg>Search</button>
    </sc-if>
    <sc-if value="{{notes.none}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 110px; color: var(--mut)">
        <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{ic.search}}"></path></svg>
        <div style="font-size: 15px">No matches</div>
      </div>
    </sc-if>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{notes.colL}}" as="n" hint-placeholder-count="3">
          <button onClick="{{n.open}}" class="tap" aria-label="Open {{n.title}}" style="display: block; width: 100%; padding: 16px; border-radius: 22px; background: var(--s2); box-sizing: border-box; text-align: left; position: relative">
            <sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="position: absolute; top: 14px; right: 12px; width: 16px; height: 16px; color: var(--acct)"><path d="{{ic.notesPin}}"></path></svg></sc-if>
            <sc-if value="{{n.isVoice}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 2px; height: 30px; margin-bottom: 12px">
                <sc-for list="{{n.bars}}" as="b" hint-placeholder-count="18"><span style="flex-grow: 1; height: {{b}}px; max-height: 30px; border-radius: 1px; background: var(--acct)"></span></sc-for>
              </div>
            </sc-if>
            <sc-if value="{{n.isLink}}" hint-placeholder-val="{{false}}">
              <div style="height: 64px; border-radius: 14px; margin-bottom: 12px; background: var(--s3); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.link}}"></path></svg></div>
            </sc-if>
            <div style="font-weight: 600; font-size: 16px; line-height: 1.25; padding-right: 14px">{{n.title}}</div>
            <sc-if value="{{n.hasBody}}" hint-placeholder-val="{{true}}"><div style="font-size: 13.5px; color: var(--mut); margin-top: 6px; line-height: 1.45; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden">{{n.body}}</div></sc-if>
            <sc-if value="{{n.isList}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
                <sc-for list="{{n.items}}" as="it" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 8px; font-size: 13.5px"><span style="width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; {{it.box}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{it.css}}">{{it.t}}</span></div>
                </sc-for>
                <sc-if value="{{n.hasMore}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); padding-left: 21px">{{n.more}}</div></sc-if>
              </div>
            </sc-if>
            <sc-if value="{{n.isVoice}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 6px">{{n.dur}}</div></sc-if>
            <sc-if value="{{n.isLink}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 6px">{{n.domain}}</div></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{notes.colR}}" as="n" hint-placeholder-count="3">
          <button onClick="{{n.open}}" class="tap" aria-label="Open {{n.title}}" style="display: block; width: 100%; padding: 16px; border-radius: 22px; background: var(--s2); box-sizing: border-box; text-align: left; position: relative">
            <sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="position: absolute; top: 14px; right: 12px; width: 16px; height: 16px; color: var(--acct)"><path d="{{ic.notesPin}}"></path></svg></sc-if>
            <sc-if value="{{n.isVoice}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 2px; height: 30px; margin-bottom: 12px">
                <sc-for list="{{n.bars}}" as="b" hint-placeholder-count="18"><span style="flex-grow: 1; height: {{b}}px; max-height: 30px; border-radius: 1px; background: var(--acct)"></span></sc-for>
              </div>
            </sc-if>
            <sc-if value="{{n.isLink}}" hint-placeholder-val="{{false}}">
              <div style="height: 64px; border-radius: 14px; margin-bottom: 12px; background: var(--s3); display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.link}}"></path></svg></div>
            </sc-if>
            <div style="font-weight: 600; font-size: 16px; line-height: 1.25; padding-right: 14px">{{n.title}}</div>
            <sc-if value="{{n.hasBody}}" hint-placeholder-val="{{true}}"><div style="font-size: 13.5px; color: var(--mut); margin-top: 6px; line-height: 1.45; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden">{{n.body}}</div></sc-if>
            <sc-if value="{{n.isList}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
                <sc-for list="{{n.items}}" as="it" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 8px; font-size: 13.5px"><span style="width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; {{it.box}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{it.css}}">{{it.t}}</span></div>
                </sc-for>
                <sc-if value="{{n.hasMore}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); padding-left: 21px">{{n.more}}</div></sc-if>
              </div>
            </sc-if>
            <sc-if value="{{n.isVoice}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 6px">{{n.dur}}</div></sc-if>
            <sc-if value="{{n.isLink}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 6px">{{n.domain}}</div></sc-if>
          </button>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{notes.hasQ}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; justify-content: center; margin-top: 18px">
        <button onClick="{{notes.askSearch}}" aria-label="{{notes.askQ}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--s2); font-size: 14px; font-weight: 600; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis"><span class="serif" style="font-style: italic; font-weight: 400; font-size: 18px; line-height: 1; color: var(--acct)">&#945;</span>{{notes.askQ}}</button>
      </div>
    </sc-if>
  </div>

  <!-- editor: text + checklist -->
  <sc-if value="{{notes.isEdit}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to notes" onClick="{{notes.ed.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <div style="flex-grow: 1"></div>
        <button class="ib" aria-label="{{notes.ed.dictLabel}}" onClick="{{notes.ed.dictate}}" style="{{notes.ed.dictCss}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.mic}}"></path></svg></button>
        <button class="ib" aria-label="{{notes.ed.listLabel}}" onClick="{{notes.ed.toggleList}}" style="{{notes.ed.listCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.notesList}}"></path></svg></button>
        <button class="ib" aria-label="{{notes.ed.pinLabel}}" onClick="{{notes.ed.pin}}" style="{{notes.ed.pinCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.notesPin}}"></path></svg></button>
        <button class="ib" aria-label="Share note" onClick="{{notes.ed.share}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
        <button class="ib" aria-label="Delete note" onClick="{{notes.ed.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div style="padding: 4px 24px 0; flex-shrink: 0">
        <input aria-label="Title" placeholder="Title" value="{{notes.ed.title}}" onChange="{{notes.ed.onTitle}}" class="serif" style="width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 32px; font-family: 'Denton', 'Fraunces', Georgia, serif; font-weight: 300; padding: 6px 0; letter-spacing: -.01em">
      </div>
      <sc-if value="{{notes.ed.isText}}" hint-placeholder-val="{{true}}">
        <textarea aria-label="Note" placeholder="Note" value="{{notes.ed.body}}" onChange="{{notes.ed.onBody}}" class="scr" style="flex-grow: 1; width: calc(100% - 48px); margin: 0 24px; box-sizing: border-box; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px; line-height: 1.55; padding: 10px 0 190px; touch-action: pan-y"></textarea>
      </sc-if>
      <sc-if value="{{notes.ed.isList}}" hint-placeholder-val="{{false}}">
        <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 8px 12px 190px; touch-action: pan-y">
          <sc-for list="{{notes.ed.items}}" as="it" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 2px; min-height: 48px">
              <button aria-label="{{it.label}}" onClick="{{it.toggle}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; {{it.box}}"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.4"><path d="{{ic.check}}"></path></svg></span></button>
              <input aria-label="Item" value="{{it.t}}" onChange="{{it.onText}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 17px; {{it.css}}">
              <button class="ib" aria-label="Remove {{it.t}}" onClick="{{it.remove}}" style="color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
            </div>
          </sc-for>
          <div style="display: flex; align-items: center; gap: 2px; min-height: 48px">
            <button aria-label="Add item" onClick="{{notes.ed.addItem}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.plus}}"></path></svg></button>
            <input aria-label="New item" placeholder="Add item" value="{{notes.ed.newItem}}" onChange="{{notes.ed.onNew}}" onKeyDown="{{notes.ed.newKey}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 17px">
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <!-- voice note -->
  <sc-if value="{{notes.isVoice}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to notes" onClick="{{notes.vo.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <div style="flex-grow: 1"></div>
        <button class="ib" aria-label="{{notes.vo.pinLabel}}" onClick="{{notes.vo.pin}}" style="{{notes.vo.pinCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.notesPin}}"></path></svg></button>
        <button class="ib" aria-label="Share note" onClick="{{notes.vo.share}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
        <button class="ib" aria-label="Delete note" onClick="{{notes.vo.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 150px; touch-action: pan-y">
        <input aria-label="Title" value="{{notes.vo.title}}" onChange="{{notes.vo.onTitle}}" style="width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 34px; font-family: 'Denton', 'Fraunces', Georgia, serif; font-weight: 300; padding: 4px 0; letter-spacing: -.01em">
        <div style="font-size: 14px; color: var(--mut); margin-top: 2px">{{notes.vo.meta}}</div>

        <div style="display: flex; align-items: center; gap: 14px; margin-top: 22px">
          <button aria-label="{{notes.vo.playLabel}}" onClick="{{notes.vo.play}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; {{notes.vo.playCss}}"><path d="{{notes.vo.playIcon}}"></path></svg></button>
          <div style="flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 2px; height: 36px">
              <sc-for list="{{notes.vo.bars}}" as="b" hint-placeholder-count="40"><span style="flex-grow: 1; height: {{b.h}}px; border-radius: 1px; background: {{b.c}}"></span></sc-for>
            </div>
            <div style="font-size: 12px; color: var(--mut); margin-top: 4px; text-align: right">{{notes.vo.time}}</div>
          </div>
        </div>

        <sc-if value="{{notes.vo.proc}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 24px; background: var(--s2); margin-top: 22px">
            <span class="dot" style="display: block"><span class="serif" style="font-style: italic; font-weight: 400; font-size: 24px; line-height: 1; color: var(--acct)">&#945;</span></span>
            <div class="dot" style="height: 12px; width: 86%; border-radius: 6px; background: var(--s3)"></div>
            <div class="dot" style="height: 12px; width: 64%; border-radius: 6px; background: var(--s3)"></div>
            <div class="dot" style="height: 12px; width: 74%; border-radius: 6px; background: var(--s3)"></div>
          </div>
        </sc-if>
        <sc-if value="{{notes.vo.ready}}" hint-placeholder-val="{{true}}">
          <div class="enter" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 24px; background: var(--s2); margin-top: 22px">
            <span class="serif" style="font-style: italic; font-weight: 400; font-size: 24px; line-height: 1; color: var(--acct)">&#945;</span>
            <sc-if value="{{notes.vo.noSummary}}" hint-placeholder-val="{{false}}"><div style="font-size: 15px; color: var(--mut)">Too short to summarize</div></sc-if>
            <sc-for list="{{notes.vo.summary}}" as="b" hint-placeholder-count="3">
              <div style="display: flex; gap: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: var(--acct); margin-top: 8px; flex-shrink: 0"></span><span style="font-size: 15px; line-height: 1.45">{{b}}</span></div>
            </sc-for>
          </div>
          <sc-if value="{{notes.vo.hasActions}}" hint-placeholder-val="{{true}}">
            <div class="enter" style="padding: 8px 8px 10px 6px; border-radius: 24px; background: var(--s2); margin-top: 10px">
              <sc-for list="{{notes.vo.actions}}" as="a" hint-placeholder-count="3">
                <div style="display: flex; align-items: flex-start; gap: 4px">
                  <button aria-label="{{a.label}}" onClick="{{a.toggle}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; {{a.box}}"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.4"><path d="{{ic.check}}"></path></svg></span></button>
                  <span style="font-size: 15px; line-height: 1.4; padding: 11px 8px 11px 0; {{a.css}}">{{a.t}}</span>
                </div>
              </sc-for>
              <button onClick="{{notes.vo.toCal}}" aria-label="{{notes.vo.calLabel}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; margin: 6px 0 4px 10px; border-radius: 18px; background: var(--bg); font-size: 14px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{notes.vo.calIcon}}"></path></svg>{{notes.vo.calText}}</button>
            </div>
          </sc-if>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 26px">
          <sc-for list="{{notes.vo.lines}}" as="l" hint-placeholder-count="4">
            <button onClick="{{l.seek}}" aria-label="Play from {{l.at}}" class="tap" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; margin: 0 -8px; border-radius: 16px; text-align: left">
              <span style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10.5px; font-weight: 700; {{l.chip}}">{{l.ini}}</span>
              <div style="min-width: 0; flex-grow: 1">
                <div style="font-size: 12px; color: var(--mut)">{{l.who}} · {{l.at}}</div>
                <div style="font-size: 16px; line-height: 1.45; margin-top: 2px; {{l.css}}">{{l.t}}</div>
              </div>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- link clip -->
  <sc-if value="{{notes.isLink}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back to notes" onClick="{{notes.lk.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <div style="flex-grow: 1"></div>
        <button class="ib" aria-label="{{notes.lk.pinLabel}}" onClick="{{notes.lk.pin}}" style="{{notes.lk.pinCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.notesPin}}"></path></svg></button>
        <button class="ib" aria-label="Share note" onClick="{{notes.lk.share}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
        <button class="ib" aria-label="Delete note" onClick="{{notes.lk.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 150px; touch-action: pan-y">
        <h1 class="serif" style="margin: 0; font-size: 34px; line-height: 1.08; letter-spacing: -.01em">{{notes.lk.title}}</h1>
        <button onClick="{{notes.lk.visit}}" aria-label="Open {{notes.lk.domain}}" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; margin-top: 14px; border-radius: 20px; background: var(--s2); font-size: 14px; color: var(--acct)"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="{{ic.link}}"></path></svg>{{notes.lk.domain}}</button>
        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 28px">
          <sc-for list="{{notes.lk.clips}}" as="c" hint-placeholder-count="3">
            <div style="display: flex; gap: 14px"><span style="width: 3px; border-radius: 2px; background: var(--acc); flex-shrink: 0"></span><div class="serif" style="font-size: 21px; line-height: 1.35">{{c}}</div></div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- share sheet -->
  <sc-if value="{{notes.shareSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close share" onClick="{{notes.closeSheet}}" style="position: absolute; inset: 0; z-index: 8; background: var(--scrim)"></button>
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 20px 40px; box-shadow: 0 -10px 40px var(--shc)">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--s3); margin: 0 auto 6px"></div>
      <div style="display: flex; align-items: center; margin-right: -8px"><h2 class="serif" style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 300">Share</h2><button class="ib" aria-label="Close" onClick="{{notes.closeSheet}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button></div>
      <div style="display: flex; gap: 12px; padding-top: 14px">
        <button onClick="{{notes.shareMsg}}" aria-label="Share in Messages" class="tap" style="flex: 1 1 0; height: 108px; border-radius: 24px; background: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.bubble}}"></path></svg>Messages</button>
        <button onClick="{{notes.shareMail}}" aria-label="Share by email" class="tap" style="flex: 1 1 0; height: 108px; border-radius: 24px; background: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.mail}}"></path></svg>Email</button>
      </div>
    </div>
  </sc-if>

  <!-- recorder -->
  <sc-if value="{{notes.recording}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; padding: 44px 24px 0; box-sizing: border-box">
      <div style="display: flex; align-items: center; height: 56px; margin: 0 -16px 8px">
        <button class="ib" aria-label="Discard recording" onClick="{{notes.rec.discard}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <sc-if value="{{notes.rec.live}}" hint-placeholder-val="{{true}}"><span class="dot" style="width: 12px; height: 12px; border-radius: 6px; {{notes.rec.dotCss}}"></span></sc-if>
        <sc-if value="{{notes.rec.paused}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 12px; border-radius: 6px; {{notes.rec.dotCss}}"></span></sc-if>
        <span class="serif" style="font-size: 72px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; {{notes.rec.clockCss}}">{{notes.rec.clock}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 3px; height: 72px; margin-top: 26px">
        <sc-for list="{{notes.rec.levels}}" as="b" hint-placeholder-count="44"><span style="flex: 1 1 0; height: {{b.h}}px; border-radius: 2px; background: var(--acct); transition: height .2s"></span></sc-for>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; margin-top: 26px; display: flex; flex-direction: column-reverse; gap: 18px; padding-bottom: 12px">
        <sc-for list="{{notes.rec.lines}}" as="l" hint-placeholder-count="3">
          <div class="enter" style="display: flex; gap: 12px; align-items: flex-start">
            <span style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10.5px; font-weight: 700; {{l.chip}}">{{l.ini}}</span>
            <span style="font-size: 18px; line-height: 1.45; padding-top: 2px; {{l.css}}">{{l.t}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 40px; padding: 20px 0 56px; flex-shrink: 0">
        <span style="width: 60px; height: 60px"></span>
        <button aria-label="Stop and save" onClick="{{notes.rec.stop}}" style="width: 84px; height: 84px; border-radius: 42px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: currentColor"><path d="{{ic.stop}}"></path></svg></button>
        <button class="ib" aria-label="{{notes.rec.pauseLabel}}" onClick="{{notes.rec.toggle}}" style="width: 60px; height: 60px; border-radius: 30px; background: var(--s2)"><svg class="i" viewBox="0 0 24 24"><path d="{{notes.rec.pauseIcon}}"></path></svg></button>
      </div>
    </div>
  </sc-if>
</div>
