<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-if value="{{messages.notSearching}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
      <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Messages</h1>
      <button class="ib" aria-label="Search messages" onClick="{{messages.openSearch}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.search}}"></path></svg></button>
      <button class="ib" aria-label="New message" onClick="{{messages.newMsg}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.plus}}"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{messages.searching}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 4px 0 16px; border-radius: 24px; background: var(--s2)">
        <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.search}}"></path></svg>
        <input aria-label="Search messages" placeholder="Search messages" value="{{messages.sq}}" onChange="{{messages.onSq}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; padding: 0; background: transparent; color: var(--fg); font-size: 16px">
        <button class="ib" aria-label="Close search" onClick="{{messages.closeSearch}}" style="width: 40px; height: 40px"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.x}}"></path></svg></button>
      </div>
    </div>
  </sc-if>
  <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 6px 0 120px; touch-action: pan-y">
    <sc-for list="{{messages.convos}}" as="c" hint-placeholder-count="5">
      <div onPointerDown="{{c.down}}" onPointerUp="{{c.up}}" style="position: relative; overflow: hidden; touch-action: pan-y">
        <div style="position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; background: var(--s2); color: var(--fg)">
          <svg class="i" viewBox="0 0 24 24" style="color: var(--acct); fill: currentColor; width: 20px; height: 20px"><path d="{{ic.msgUnread}}"></path></svg>
          <svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg>
        </div>
        <button aria-label="{{c.label}}" onClick="{{c.open}}" style="position: relative; width: 100%; display: flex; gap: 14px; padding: 12px 20px; align-items: center; box-sizing: border-box; background: var(--bg); transform: translateX({{c.tx}}px); transition: transform .28s cubic-bezier(.19,1,.22,1)">
          <span style="width: 52px; height: 52px; border-radius: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; background: var(--s2)">{{c.ini}}</span>
          <div style="flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="flex-grow: 1; font-size: 16px; font-weight: {{c.nameW}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
              <span style="font-size: 12px; color: var(--mut); white-space: nowrap">{{c.time}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 3px">
              <span style="flex-grow: 1; min-width: 0; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{c.lastCss}}">{{c.last}}</span>
              <span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{c.dot}}"></span>
            </div>
          </div>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{messages.empty}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 110px; color: var(--mut)">
        <svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{messages.emptyIcon}}"></path></svg>
        <span style="font-size: 15px">{{messages.emptyText}}</span>
      </div>
    </sc-if>
    <sc-if value="{{messages.hasSq}}" hint-placeholder-val="{{false}}">
      <button class="tap" onClick="{{messages.askSq}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 20px; box-sizing: border-box">
        <span style="width: 52px; height: 52px; border-radius: 26px; flex-shrink: 0; background: var(--s2); color: var(--acct); display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 24px"><span class="al">α</span></span>
        <span style="font-size: 15px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ask {{name}}: “{{messages.sq}}”</span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{messages.picking}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px 0 8px; gap: 6px; flex-shrink: 0">
        <button class="ib" aria-label="Back to messages" onClick="{{back}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <input aria-label="Name or number" placeholder="Name or number" value="{{messages.p.q}}" onChange="{{messages.p.onQ}}" onKeyDown="{{messages.p.onKey}}" style="flex-grow: 1; min-width: 0; height: 46px; border: 0; outline: 0; border-radius: 23px; padding: 0 18px; background: var(--s2); color: var(--fg); font-size: 16px">
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 10px 0 120px; touch-action: pan-y">
        <sc-if value="{{messages.p.isNum}}" hint-placeholder-val="{{false}}">
          <button class="tap" aria-label="Text {{messages.p.num}}" onClick="{{messages.p.goNum}}" style="width: 100%; display: flex; gap: 14px; padding: 10px 20px; align-items: center; box-sizing: border-box">
            <span style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--acc); color: #fff"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.bubble}}"></path></svg></span>
            <span style="font-size: 16px; font-weight: 600">{{messages.p.num}}</span>
          </button>
        </sc-if>
        <sc-for list="{{messages.p.people}}" as="pp" hint-placeholder-count="6">
          <button class="tap" aria-label="Text {{pp.name}}" onClick="{{pp.go}}" style="width: 100%; display: flex; gap: 14px; padding: 10px 20px; align-items: center; box-sizing: border-box">
            <span style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--s2)">{{pp.ini}}</span>
            <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 16px">{{pp.name}}</span><span style="font-size: 13px; color: var(--mut)">{{pp.phone}}</span></span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{messages.inThread}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 5">
      <div style="display: flex; align-items: center; height: 60px; margin-top: 44px; padding: 0 8px; gap: 4px; flex-shrink: 0">
        <button class="ib" aria-label="Back to messages" onClick="{{back}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <button class="tap" aria-label="Contact {{messages.t.name}}" onClick="{{messages.t.who}}" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border-radius: 24px">
          <span style="width: 38px; height: 38px; border-radius: 19px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--s2)">{{messages.t.ini}}</span>
          <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{messages.t.name}}</span>
        </button>
        <button class="ib" aria-label="Call {{messages.t.name}}" onClick="{{messages.t.call}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.phone}}"></path></svg></button>
      </div>

      <div class="scr" style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; touch-action: pan-y">
        <div style="display: flex; flex-direction: column; padding: 12px 16px 12px">
          <sc-for list="{{messages.t.bubbles}}" as="b" hint-placeholder-count="5">
            <sc-if value="{{b.sep}}" hint-placeholder-val="{{false}}">
              <div style="text-align: center; font-size: 12px; color: var(--mut); padding: 14px 0 6px">{{b.sepLabel}}</div>
            </sc-if>
            <div style="display: flex; {{b.row}}">
              <sc-if value="{{b.isText}}" hint-placeholder-val="{{true}}">
                <div style="max-width: 78%; padding: 10px 15px; font-size: 16px; line-height: 1.35; {{b.css}}">{{b.text}}</div>
              </sc-if>
              <sc-if value="{{b.isFile}}" hint-placeholder-val="{{false}}">
                <button aria-label="Open {{b.file}}" onClick="{{b.openFile}}" style="max-width: 78%; display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; {{b.css}}">
                  <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.notes}}"></path></svg></span>
                  <span style="min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.file}}</span><span style="font-size: 12px; opacity: .75">{{b.size}}</span></span>
                </button>
              </sc-if>
              <sc-if value="{{b.isPhoto}}" hint-placeholder-val="{{false}}">
                <button aria-label="Photo" onClick="{{b.openPhoto}}" style="width: 180px; height: 136px; {{b.photoCss}}"></button>
              </sc-if>
            </div>
          </sc-for>
          <sc-if value="{{messages.t.typing}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; margin-top: 12px">
              <div aria-label="Typing" style="display: flex; gap: 5px; align-items: center; height: 40px; padding: 0 16px; border-radius: 20px 20px 20px 6px; background: var(--s2)">
                <span class="dot" style="width: 7px; height: 7px; border-radius: 4px; background: var(--mut)"></span>
                <span class="dot" style="width: 7px; height: 7px; border-radius: 4px; background: var(--mut); animation-delay: .2s"></span>
                <span class="dot" style="width: 7px; height: 7px; border-radius: 4px; background: var(--mut); animation-delay: .4s"></span>
              </div>
            </div>
          </sc-if>
        </div>
      </div>

      <div style="flex-shrink: 0; padding: 6px 12px 30px">
        <sc-if value="{{messages.t.hasSmart}}" hint-placeholder-val="{{true}}">
          <div class="scr" style="display: flex; gap: 8px; padding: 2px 0 10px; overflow-x: auto; touch-action: pan-x">
            <button aria-label="Ask {{name}} to reply" onClick="{{messages.t.ask}}" style="height: 36px; padding: 0 14px 0 12px; border-radius: 18px; flex-shrink: 0; background: var(--s2); display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; white-space: nowrap"><span style="color: var(--acct); font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 19px; line-height: 1"><span class="al">α</span></span>Reply</button>
            <sc-for list="{{messages.t.smart}}" as="s" hint-placeholder-count="3">
              <button onClick="{{s.go}}" style="height: 36px; padding: 0 15px; border-radius: 18px; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; font-weight: 500; white-space: nowrap">{{s.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{messages.t.tray}}" hint-placeholder-val="{{false}}">
          <div class="drop" style="display: flex; gap: 8px; padding: 2px 0 10px">
            <button aria-label="Camera" onClick="{{messages.t.camera}}" style="width: 72px; height: 72px; border-radius: 18px; flex-shrink: 0; background: var(--s2); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.camera}}"></path></svg></button>
            <sc-for list="{{messages.t.photos}}" as="ph" hint-placeholder-count="4">
              <button aria-label="{{ph.label}}" onClick="{{ph.pick}}" style="width: 72px; height: 72px; border-radius: 18px; flex-shrink: 0; {{ph.css}}"></button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{messages.t.hasAtts}}" hint-placeholder-val="{{false}}">
          <div class="scr" style="display: flex; gap: 6px; padding: 2px 0 10px; overflow-x: auto">
            <sc-for list="{{messages.t.atts}}" as="a" hint-placeholder-count="1">
              <button aria-label="Remove {{a.name}}" onClick="{{a.rm}}" style="height: 36px; padding: 0 10px 0 12px; border-radius: 18px; background: var(--s2); display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; flex-shrink: 0; white-space: nowrap"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--acct)"><path d="{{ic.notes}}"></path></svg>{{a.name}}<svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--mut)"><path d="{{ic.x}}"></path></svg></button>
            </sc-for>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 8px">
          <button aria-label="Attach" onClick="{{messages.t.toggleTray}}" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: transform .25s; {{messages.t.trayCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.plus}}"></path></svg></button>
          <input aria-label="Message" placeholder="Message" value="{{messages.t.text}}" onChange="{{messages.t.onText}}" onKeyDown="{{messages.t.onKey}}" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; outline: 0; border-radius: 24px; padding: 0 18px; background: var(--s2); color: var(--fg); font-size: 16px">
          <button aria-label="Send message" onClick="{{messages.t.send}}" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; {{messages.t.sendCss}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.send}}"></path></svg></button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
