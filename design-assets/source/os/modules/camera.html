<div style="display: flex; flex-direction: column; height: 100%; position: relative; background: #000000; color: #ffffff; overflow: hidden">
  <button aria-label="Viewfinder. Tap to focus, hold to ask Alpha, swipe to change mode" onPointerDown="{{camera.vfDown}}" onPointerUp="{{camera.vfUp}}" onPointerLeave="{{camera.vfLeave}}" style="position: absolute; left: 0; right: 0; top: 96px; height: 549px; overflow: hidden; display: block; background: {{camera.vfBg}}">
    <span style="position: absolute; left: -4%; width: 108%; top: 50%; aspect-ratio: 3 / 4; display: block; transition: transform 2s ease-in-out; {{camera.drift}}">
      <span style="position: absolute; inset: 0; display: block; background: {{camera.bg}}; transition: transform .35s cubic-bezier(.2,.8,.2,1), filter .26s; {{camera.zoomCss}}">
        <sc-if value="{{camera.scanFound}}" hint-placeholder-val="{{false}}">
          <span class="fadein" style="position: absolute; left: 15%; top: 10%; width: 70%; height: 80%; display: block; background: rgba(0,0,255,.06); box-shadow: 0 0 0 2px rgba(90,100,255,.9)"></span>
          <span class="fadein" style="position: absolute; left: calc(15% - 6px); top: calc(10% - 6px); width: 26px; height: 26px; border-left: 4px solid #ffffff; border-top: 4px solid #ffffff; border-radius: 6px 0 0 0; display: block"></span>
          <span class="fadein" style="position: absolute; right: calc(15% - 6px); top: calc(10% - 6px); width: 26px; height: 26px; border-right: 4px solid #ffffff; border-top: 4px solid #ffffff; border-radius: 0 6px 0 0; display: block"></span>
          <span class="fadein" style="position: absolute; left: calc(15% - 6px); bottom: calc(10% - 6px); width: 26px; height: 26px; border-left: 4px solid #ffffff; border-bottom: 4px solid #ffffff; border-radius: 0 0 0 6px; display: block"></span>
          <span class="fadein" style="position: absolute; right: calc(15% - 6px); bottom: calc(10% - 6px); width: 26px; height: 26px; border-right: 4px solid #ffffff; border-bottom: 4px solid #ffffff; border-radius: 0 0 6px 0; display: block"></span>
        </sc-if>
      </span>
    </span>
    <sc-if value="{{camera.hasFocus}}" hint-placeholder-val="{{false}}">
      <span class="fadein" style="position: absolute; width: 68px; height: 68px; border-radius: 34px; box-shadow: inset 0 0 0 1.5px #ffffff; display: block; {{camera.focus}}"></span>
    </sc-if>
    <span style="position: absolute; inset: 0; display: block; background: #ffffff; pointer-events: none; opacity: {{camera.flOp}}; transition: {{camera.flTr}}"></span>
  </button>

  <div style="position: absolute; left: 0; right: 0; top: 44px; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 2">
    <button class="ib" aria-label="{{camera.flashLabel}}" onClick="{{camera.toggleFlash}}"><svg class="i" viewBox="0 0 24 24"><path d="{{camera.flashIcon}}"></path></svg></button>
    <sc-if value="{{camera.rec}}" hint-placeholder-val="{{false}}">
      <span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; background: #E53935; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums"><span class="dot" style="width: 7px; height: 7px; border-radius: 4px; background: #ffffff"></span>{{camera.recTime}}</span>
    </sc-if>
    <button class="ib" aria-label="Ask Alpha about this" onClick="{{camera.ask}}"><span style="width: 30px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 18px"><span class="al">α</span></span></button>
  </div>

  <sc-if value="{{camera.hasSaid}}" hint-placeholder-val="{{false}}">
    <button class="drop" aria-label="Dismiss" onClick="{{camera.clearSaid}}" style="position: absolute; left: 16px; right: 16px; top: 108px; z-index: 3; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 22px; background: rgba(0,0,0,.62); color: #ffffff; text-align: left">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: var(--acc); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 16px"><span class="al">α</span></span>
      <span style="font-size: 14.5px; line-height: 1.4">{{camera.said}}</span>
    </button>
  </sc-if>
  <sc-if value="{{camera.showZoom}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; top: 585px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 2; pointer-events: none">
      <sc-for list="{{camera.zooms}}" as="z" hint-placeholder-count="4">
        <button aria-label="{{z.aria}}" onClick="{{z.pick}}" style="border-radius: 22px; display: flex; align-items: center; justify-content: center; font-weight: 700; pointer-events: auto; transition: all .2s; {{z.css}}">{{z.label}}</button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{camera.scanning}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; top: 590px; display: flex; justify-content: center; z-index: 2; pointer-events: none">
      <span style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(0,0,0,.5); font-size: 13.5px"><span class="dot" style="width: 7px; height: 7px; border-radius: 4px; background: #ffffff"></span>Looking for a page</span>
    </div>
  </sc-if>
  <sc-if value="{{camera.scanFound}}" hint-placeholder-val="{{false}}">
    <div class="drop" style="position: absolute; left: 0; right: 0; top: 548px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 2">
      <span style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 4px; border-radius: 15px; background: rgba(0,0,0,.55); font-size: 13px"><span style="width: 22px; height: 22px; border-radius: 11px; background: var(--acc); display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 14px"><span class="al">α</span></span>Open Studio · {{camera.posterDay}}</span>
      <div style="display: flex; gap: 8px">
        <button aria-label="Add event" onClick="{{camera.addEvent}}" style="height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: #ffffff; color: #000000; display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px"><path d="{{ic.cal}}"></path></svg>Add event</button>
        <button aria-label="Save to Files" onClick="{{camera.saveFiles}}" style="height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: rgba(0,0,0,.55); color: #ffffff; display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600"><svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px"><path d="{{ic.folder}}"></path></svg>Save to Files</button>
        <button aria-label="Open link" onClick="{{camera.openLink}}" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(0,0,0,.55); color: #ffffff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px"><path d="{{ic.link}}"></path></svg></button>
      </div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; top: 656px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px">
    <sc-for list="{{camera.modes}}" as="m" hint-placeholder-count="3">
      <button onClick="{{m.pick}}" aria-label="{{m.label}} mode" style="height: 44px; padding: 0 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 14.5px; font-weight: 600; transition: color .2s; {{m.css}}">
        {{m.label}}
        <span style="width: 4px; height: 4px; border-radius: 2px; background: #ffffff; opacity: {{m.dot}}"></span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 712px; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px">
    <sc-if value="{{camera.hasLast}}" hint-placeholder-val="{{true}}">
      <button aria-label="Open last photo" onClick="{{camera.openLast}}" style="position: relative; width: 52px; height: 52px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7); display: block">
        <span style="position: absolute; left: 0; width: 100%; top: 50%; aspect-ratio: 3 / 4; display: block; background: {{camera.lastBg}}; transform: translateY(-50%) {{camera.lastTf}}; filter: {{camera.lastFlt}}"></span>
      </button>
    </sc-if>
    <sc-if value="{{camera.noLast}}" hint-placeholder-val="{{false}}"><span style="width: 52px; height: 52px"></span></sc-if>
    <button aria-label="{{camera.shutterLabel}}" onClick="{{camera.shutter}}" style="width: 80px; height: 80px; border-radius: 40px; box-shadow: inset 0 0 0 4px #ffffff; display: flex; align-items: center; justify-content: center">
      <span style="display: flex; align-items: center; justify-content: center; color: #000000; transition: all .25s cubic-bezier(.2,.8,.2,1); {{camera.innerCss}}">
        <sc-if value="{{camera.scanGlyph}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.camScan}}"></path></svg></sc-if>
      </span>
    </button>
    <sc-if value="{{camera.showFlip}}" hint-placeholder-val="{{true}}">
      <button aria-label="Switch camera" onClick="{{camera.flip}}" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.camFlip}}"></path></svg></button>
    </sc-if>
    <sc-if value="{{camera.noFlip}}" hint-placeholder-val="{{false}}">
      <span style="width: 52px; height: 52px"></span>
    </sc-if>
  </div>
</div>
