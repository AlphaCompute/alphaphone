<div ref="{{settings.rootRef}}" style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-for list="{{settings.stack}}" as="p" hint-placeholder-count="1">
    <div class="{{p.cls}}" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: {{p.z}}">
      <sc-if value="{{p.isTop}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
          <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">{{p.title}}</h1>
        </div>
      </sc-if>
      <sc-if value="{{p.notTop}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px 0 8px; gap: 4px; flex-shrink: 0">
          <button class="ib" aria-label="{{p.backLabel}}" onClick="{{p.back}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
          <h1 class="serif" style="margin: 0; font-size: 26px; flex-grow: 1; min-width: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.title}}</h1>
          <sc-if value="{{p.hasHdrTog}}" hint-placeholder-val="{{false}}">
            <button aria-label="{{p.hdrTog.aria}}" aria-pressed="{{p.hdrTog.on}}" onClick="{{p.hdrTog.toggle}}" style="position: relative; width: 52px; height: 32px; border-radius: 16px; flex-shrink: 0; transition: background .25s; {{p.hdrTog.track}}">
              <span style="position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.19,1,.22,1); transform: translateX({{p.hdrTog.kx}}px)"></span>
            </button>
          </sc-if>
        </div>
      </sc-if>

      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 0 130px; touch-action: pan-y">
        <sc-if value="{{p.isTop}}" hint-placeholder-val="{{true}}">
          <div style="margin: 4px 16px 14px; padding: 18px 16px 16px 18px; border-radius: 30px; background: var(--s2)">
            <div style="display: flex; align-items: center; gap: 14px">
              <div style="position: relative; width: 56px; height: 56px; flex-shrink: 0">
                <span style="position: absolute; inset: 0; border-radius: 28px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 32px"><span class="al">α</span></span>
              </div>
              <input aria-label="Agent name" placeholder="Alpha" value="{{settings.charVal}}" onChange="{{settings.onName}}" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font-family: Denton, Fraunces, Georgia, serif; font-weight: 300; font-size: 32px; padding: 2px 0 6px; outline: none">
            </div>
            <button class="tap" aria-label="Character" onClick="{{settings.openChar}}" style="margin-top: 14px; width: 100%; height: 48px; border-radius: 24px; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; box-sizing: border-box">
              <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.wave}}"></path></svg>
              <span style="flex-grow: 1; text-align: left; font-size: 14.5px">{{settings.persona}}</span>
              <svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--mut)"><path d="{{ic.right}}"></path></svg>
            </button>
          </div>
        </sc-if>

        <sc-if value="{{p.hero.kBig}}" hint-placeholder-val="{{false}}">
          <div style="padding: 4px 24px 22px; display: flex; flex-direction: column; align-items: flex-start">
            <sc-if value="{{p.hero.hasIcon}}" hint-placeholder-val="{{false}}">
              <span style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; {{p.hero.iconCss}}"><svg class="i" viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="{{p.hero.d}}"></path></svg></span>
            </sc-if>
            <sc-if value="{{p.hero.hasIni}}" hint-placeholder-val="{{false}}">
              <span style="width: 64px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; margin-bottom: 14px; {{p.hero.iconCss}}">{{p.hero.ini}}</span>
            </sc-if>
            <div class="serif" style="font-size: 34px; line-height: 1.1; letter-spacing: -.01em; word-break: break-word; {{p.hero.bigCss}}">{{p.hero.big}}</div>
            <div style="font-size: 14px; color: var(--mut); margin-top: 6px; {{p.hero.subCss}}">{{p.hero.sub}}</div>
            <sc-if value="{{p.hero.hasMeter}}" hint-placeholder-val="{{false}}">
              <div style="width: 100%; height: 14px; border-radius: 7px; background: var(--s2); margin-top: 18px; overflow: hidden"><div style="height: 100%; width: {{p.hero.meter}}%; background: var(--acc); border-radius: 7px"></div></div>
            </sc-if>
          </div>
        </sc-if>

        <sc-if value="{{p.hero.kWeb}}" hint-placeholder-val="{{false}}">
          <div style="margin: 4px 16px 16px; border-radius: 26px; background: var(--s2); overflow: hidden">
            <div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--mut)">
              <svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="{{ic.lock}}"></path></svg><span>{{p.hero.host}}</span>
            </div>
            <div style="padding: 22px 20px 24px">
              <div class="serif" style="font-size: 26px; line-height: 1.15">{{p.hero.big}}</div>
              <div style="font-size: 14px; color: var(--mut); margin-top: 10px">{{p.hero.sub}}</div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{p.hero.kChar}}" hint-placeholder-val="{{false}}">
          <div style="padding: 56px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px">
            <div style="position: relative; width: 96px; height: 96px; margin-bottom: 32px">
              <span class="ring" style="position: absolute; inset: 0; border-radius: 48px; background: var(--acc)"></span>
              <span style="position: absolute; inset: 0; border-radius: 48px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 54px"><span class="al">α</span></span>
            </div>
            <input aria-label="Agent name" placeholder="Alpha" value="{{settings.charVal}}" onChange="{{settings.onName}}" style="width: 100%; text-align: center; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); font-family: Denton, Fraunces, Georgia, serif; font-weight: 300; font-size: 38px; padding: 2px 0 8px; outline: none">
          </div>
        </sc-if>

        <sc-for list="{{p.groups}}" as="g" hint-placeholder-count="2">
          <sc-if value="{{g.hasCap}}" hint-placeholder-val="{{false}}">
            <div style="padding: 2px 30px 8px; font-size: 13px; color: var(--mut)">{{g.cap}}</div>
          </sc-if>
          <div style="margin: 0 16px 12px; border-radius: 26px; overflow: hidden; {{g.css}}">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <sc-if value="{{r.kNav}}" hint-placeholder-val="{{true}}">
                <button class="tap" onClick="{{r.go}}" aria-label="{{r.lbl}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 8px 16px 8px 18px; min-height: 58px; box-sizing: border-box; text-align: left">
                  <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{true}}"><svg class="i" viewBox="0 0 24 24" style="{{r.labCss}}"><path d="{{r.d}}"></path></svg></sc-if>
                  <sc-if value="{{r.hasTile}}" hint-placeholder-val="{{false}}"><span style="width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; {{r.tileCss}}">{{r.tile}}</span></sc-if>
                  <div style="flex-grow: 1; min-width: 0">
                    <div style="font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{r.labCss0}}; {{r.labCss}}">{{r.label}}</div>
                    <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</div></sc-if>
                  </div>
                  <sc-if value="{{r.hasVal}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; color: var(--mut); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; {{r.valCss}}">{{r.val}}</span></sc-if>
                  <sc-if value="{{r.hasTrail}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; {{r.trailCss}}"><path d="{{r.trail}}"></path></svg></sc-if>
                  <sc-if value="{{r.chev}}" hint-placeholder-val="{{true}}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--mut)"><path d="{{ic.right}}"></path></svg></sc-if>
                </button>
              </sc-if>

              <sc-if value="{{r.kTog}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 14px; padding: 8px 16px 8px 18px; min-height: 58px; box-sizing: border-box">
                  <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24"><path d="{{r.d}}"></path></svg></sc-if>
                  <div style="flex-grow: 1; min-width: 0">
                    <div style="font-size: 16px">{{r.label}}</div>
                    <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></sc-if>
                  </div>
                  <button aria-label="{{r.aria}}" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="position: relative; width: 52px; height: 32px; border-radius: 16px; flex-shrink: 0; transition: background .25s; {{r.track}}">
                    <span style="position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.19,1,.22,1); transform: translateX({{r.kx}}px)"></span>
                  </button>
                </div>
              </sc-if>

              <sc-if value="{{r.kSlider}}" hint-placeholder-val="{{false}}">
                <div style="padding: 12px 18px 8px">
                  <sc-if value="{{r.noAB}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; align-items: center; gap: 12px; font-size: 15px">
                      <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{r.d}}"></path></svg></sc-if>
                      <span style="flex-grow: 1">{{r.label}}</span><span style="font-size: 13px; color: var(--mut)">{{r.v}}</span>
                    </div>
                  </sc-if>
                  <sc-if value="{{r.hasAB}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--mut)"><span>{{r.a}}</span><span>{{r.b}}</span></div>
                  </sc-if>
                  <input type="range" min="0" max="100" value="{{r.v}}" onChange="{{r.set}}" aria-label="{{r.label}}" style="margin-top: 4px">
                </div>
              </sc-if>

              <sc-if value="{{r.kSeg}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 18px; min-height: 60px; box-sizing: border-box">
                  <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24"><path d="{{r.d}}"></path></svg></sc-if>
                  <span style="flex-grow: 1; min-width: 0; font-size: 16px">{{r.label}}</span>
                  <div style="display: flex; gap: 2px; padding: 3px; border-radius: 23px; background: var(--bg); flex-shrink: 0">
                    <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3">
                      <button aria-label="{{o.aria}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 38px; min-width: 52px; padding: 0 12px; border-radius: 19px; font-size: 13.5px; font-weight: 600; transition: background .2s; {{o.css}}">{{o.label}}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{r.kInfo}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 14px; padding: 8px 18px; min-height: 52px; box-sizing: border-box">
                  <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24"><path d="{{r.d}}"></path></svg></sc-if>
                  <span style="flex-grow: 1; font-size: 16px">{{r.label}}</span>
                  <span style="font-size: 14px; color: var(--mut); text-align: right">{{r.val}}</span>
                </div>
              </sc-if>

              <sc-if value="{{r.kLog}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; gap: 12px; padding: 7px 18px; font-family: 'Public Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 11.5px; line-height: 1.45">
                  <span style="color: var(--mut); white-space: nowrap">{{r.time}}</span><span style="min-width: 0; word-break: break-word">{{r.text}}</span>
                </div>
              </sc-if>

              <sc-if value="{{r.kInput}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-radius: 16px; background: var(--s2); padding: 0 16px">
                  <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--mut)"><path d="{{r.d}}"></path></svg>
                  <input aria-label="{{r.label}}" placeholder="{{r.ph}}" type="{{r.type}}" value="{{r.value}}" onChange="{{r.change}}" style="flex-grow: 1; min-width: 0; height: 52px; border: 0; background: transparent; color: var(--fg); font-size: 16px; outline: none">
                </div>
              </sc-if>

              <sc-if value="{{r.kBtn}}" hint-placeholder-val="{{false}}">
                <button aria-label="{{r.label}}" onClick="{{r.go}}" disabled="{{r.dis}}" style="width: 100%; height: 54px; border-radius: 27px; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s; {{r.css}}">
                  <sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{r.d}}"></path></svg></sc-if>{{r.label}}
                </button>
              </sc-if>

              <sc-if value="{{r.kChips}}" hint-placeholder-val="{{false}}">
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 12px">
                  <sc-for list="{{r.items}}" as="c" hint-placeholder-count="4">
                    <button aria-label="{{c.aria}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; transition: background .2s; {{c.css}}">
                      <sc-if value="{{c.notPlaying}}" hint-placeholder-val="{{true}}"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: currentColor"><path d="{{ic.play}}"></path></svg></sc-if>
                      <sc-if value="{{c.playing}}" hint-placeholder-val="{{false}}">
                        <span style="display: flex; gap: 2px; align-items: center; height: 14px; width: 14px"><span class="bar" style="width: 3px; height: 14px; border-radius: 2px; background: currentColor"></span><span class="bar" style="width: 3px; height: 14px; border-radius: 2px; background: currentColor; animation-delay: .2s"></span><span class="bar" style="width: 3px; height: 14px; border-radius: 2px; background: currentColor; animation-delay: .4s"></span></span>
                      </sc-if>
                      <span style="font-size: 15px; font-weight: 500">{{c.label}}</span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>

            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <sc-if value="{{settings.hasSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close sheet" onClick="{{settings.sheet.close}}" style="position: absolute; inset: 0; z-index: 20; background: var(--scrim)"></button>
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 28px 28px 0 0; padding: 12px 20px 38px; box-shadow: 0 -20px 60px var(--shc); display: flex; flex-direction: column; gap: 12px">
      <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--mut); opacity: .4; margin-bottom: 6px"></span>
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <div class="serif" style="flex-grow: 1; min-width: 0; font-size: 26px; line-height: 1.15; word-break: break-word; padding-top: 6px">{{settings.sheet.title}}</div>
        <button class="ib" aria-label="Close" onClick="{{settings.sheet.close}}" style="margin: -2px -8px 0 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.x}}"></path></svg></button>
      </div>
      <sc-if value="{{settings.sheet.hasSub}}" hint-placeholder-val="{{true}}">
        <div style="font-size: 15px; color: var(--mut); line-height: 1.45">{{settings.sheet.sub}}</div>
      </sc-if>
      <sc-if value="{{settings.sheet.hasScopes}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 4px 0">
          <sc-for list="{{settings.sheet.scopes}}" as="sc" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; font-size: 15.5px"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{sc.d}}"></path></svg><span>{{sc.t}}</span></div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{settings.sheet.hasInput}}" hint-placeholder-val="{{false}}">
        <input aria-label="Password" placeholder="Password" type="password" value="{{settings.sheet.pw}}" onChange="{{settings.sheet.onPw}}" onKeyDown="{{settings.sheet.onKey}}" style="width: 100%; box-sizing: border-box; height: 54px; border-radius: 18px; border: 0; background: var(--s2); color: var(--fg); padding: 0 18px; font-size: 16px; outline: none">
      </sc-if>
      <div style="display: flex; gap: 10px; margin-top: 8px">
        <button aria-label="{{settings.sheet.secondary}}" onClick="{{settings.sheet.close}}" style="flex: 1; height: 54px; border-radius: 27px; background: var(--s2); font-weight: 600; font-size: 16px; text-align: center">{{settings.sheet.secondary}}</button>
        <button aria-label="{{settings.sheet.primary}}" onClick="{{settings.sheet.ok}}" disabled="{{settings.sheet.dis}}" style="flex: 1; height: 54px; border-radius: 27px; font-weight: 600; font-size: 16px; text-align: center; transition: background .2s; {{settings.sheet.okCss}}">{{settings.sheet.primary}}</button>
      </div>
    </div>
  </sc-if>
</div>
