<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 16px 0 20px; gap: 2px; flex-shrink: 0">
    <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">{{phone.title}}</h1>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 24px; background: var(--s2)">
      <sc-for list="{{phone.tabs}}" as="t" hint-placeholder-count="3">
        <button aria-label="{{t.label}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="position: relative; width: 48px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; transition: background .2s; {{t.css}}">
          <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{t.d}}"></path></svg>
          <sc-if value="{{t.dot}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 6px; right: 9px; width: 7px; height: 7px; border-radius: 4px; background: var(--acct)"></span></sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{phone.banner}}" hint-placeholder-val="{{false}}">
    <div class="drop" style="display: flex; align-items: center; gap: 4px; margin: 6px 16px 4px; height: 56px; padding: 0 6px 0 4px; border-radius: 28px; background: #1e9e4a; color: #fff; flex-shrink: 0">
      <button aria-label="Return to call" onClick="{{phone.restore}}" style="flex-grow: 1; min-width: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding-left: 14px; text-align: left">
        <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.phone}}"></path></svg>
        <span style="flex-grow: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{phone.cName}}</span>
        <span style="font-size: 15px; font-variant-numeric: tabular-nums; opacity: .85">{{phone.cStatus}}</span>
      </button>
      <button aria-label="End call" onClick="{{phone.endCall}}" style="width: 44px; height: 44px; border-radius: 22px; background: #E5383B; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; transform: rotate(135deg)"><path d="{{ic.phone}}"></path></svg></button>
    </div>
  </sc-if>

  <!-- RECENTS (favorites row on top) -->
  <sc-if value="{{phone.isRecents}}" hint-placeholder-val="{{true}}">
    <div class="scr" style="flex-grow: 1; overflow-y: auto; padding-bottom: 130px; touch-action: pan-y">
      <sc-if value="{{phone.hasFavs}}" hint-placeholder-val="{{true}}">
        <div class="scr" style="display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 14px; touch-action: pan-x">
          <sc-for list="{{phone.favs}}" as="f" hint-placeholder-count="4">
            <button aria-label="{{f.label}}" onClick="{{f.call}}" style="flex-shrink: 0; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 7px">
              <span style="width: 60px; height: 60px; border-radius: 30px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">{{f.ini}}</span>
              <span style="font-size: 13px; max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.first}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-for list="{{phone.recents}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; padding: 0 8px 0 12px">
          <button aria-label="{{r.label}}" onClick="{{r.call}}" class="tap" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px; text-align: left">
            <span style="width: 44px; height: 44px; border-radius: 22px; background: var(--s2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0">{{r.ini}}</span>
            <div style="flex-grow: 1; min-width: 0">
              <div style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{r.nameCss}}">{{r.who}}</div>
              <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 13px; color: var(--mut)">
                <svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 2; {{r.dirCss}}"><path d="{{r.dirD}}"></path></svg>
                <span>{{r.sub}}</span>
              </div>
              <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--mut)"><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; color: var(--acct); flex-shrink: 0"><span class="al">α</span></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span></div>
              </sc-if>
            </div>
          </button>
          <button class="ib" aria-label="{{r.infoLabel}}" onClick="{{r.info}}" style="color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.infoD}}"></path></svg></button>
        </div>
      </sc-for>
      <sc-if value="{{phone.noRecents}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; justify-content: center; padding-top: 80px; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 40px; height: 40px; stroke-width: 1.2"><path d="{{ic.clock}}"></path></svg></div>
      </sc-if>
    </div>
  </sc-if>

  <!-- KEYPAD -->
  <sc-if value="{{phone.isKeypad}}" hint-placeholder-val="{{false}}">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 110px">
      <div style="height: 96px; width: 100%; display: flex; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box">
        <span style="font-size: {{phone.dialSize}}px; font-weight: 300; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{phone.dial}}</span>
      </div>
      <div style="height: 44px; display: flex; align-items: center">
        <sc-if value="{{phone.hasMatch}}" hint-placeholder-val="{{false}}">
          <button class="tap" aria-label="Use {{phone.match.name}}" onClick="{{phone.match.pick}}" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border-radius: 22px; background: var(--s2)">
            <span style="width: 32px; height: 32px; border-radius: 16px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{phone.match.ini}}</span>
            <span style="font-size: 15px; font-weight: 600">{{phone.match.name}}</span>
            <span style="font-size: 13px; color: var(--mut)">{{phone.match.num}}</span>
          </button>
        </sc-if>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 30px; margin-top: 14px">
        <sc-for list="{{phone.keys}}" as="k" hint-placeholder-count="12">
          <button class="tap" aria-label="{{k.label}}" onClick="{{k.press}}" style="width: 76px; height: 76px; border-radius: 38px; background: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
            <span style="font-size: 30px; font-weight: 400; line-height: 1">{{k.d}}</span>
            <span style="font-size: 9.5px; letter-spacing: .14em; color: var(--mut); height: 11px; font-weight: 600">{{k.sub}}</span>
          </button>
        </sc-for>
        <span></span>
        <button aria-label="Call" onClick="{{phone.dialCall}}" style="width: 76px; height: 76px; border-radius: 38px; background: #1e9e4a; color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{ic.phone}}"></path></svg></button>
        <sc-if value="{{phone.hasDial}}" hint-placeholder-val="{{false}}">
          <button aria-label="Delete digit" onClick="{{phone.delKey}}" class="tap" style="width: 76px; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.phoneDel}}"></path></svg></button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- VOICEMAIL -->
  <sc-if value="{{phone.isVm}}" hint-placeholder-val="{{false}}">
    <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 6px 0 130px; touch-action: pan-y">
      <sc-for list="{{phone.vms}}" as="v" hint-placeholder-count="3">
        <div style="margin: 0 10px 4px; border-radius: 26px; transition: background .2s; {{v.bgCss}}">
          <button onClick="{{v.toggle}}" aria-expanded="{{v.open}}" aria-label="Voicemail from {{v.who}}" style="width: 100%; display: flex; align-items: flex-start; gap: 14px; padding: 14px 12px; text-align: left; box-sizing: border-box">
            <span style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{v.avBg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0">{{v.ini}}</span>
            <div style="flex-grow: 1; min-width: 0">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="flex-grow: 1; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.who}}</span>
                <sc-if value="{{v.unheard}}" hint-placeholder-val="{{false}}"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--acct); flex-shrink: 0"></span></sc-if>
                <span style="font-size: 12px; color: var(--mut); white-space: nowrap">{{v.time}}</span>
              </div>
              <div style="font-size: 14px; line-height: 1.45; color: {{v.textColor}}; margin-top: 4px; {{v.textCss}}">{{v.text}}</div>
            </div>
          </button>
          <sc-if value="{{v.open}}" hint-placeholder-val="{{false}}">
            <div style="padding: 0 12px 14px 12px">
              <div style="display: flex; align-items: center; gap: 12px">
                <button aria-label="{{v.playLabel}}" onClick="{{v.play}}" style="width: 44px; height: 44px; border-radius: 22px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor"><path d="{{v.playD}}"></path></svg></button>
                <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden"><div style="height: 100%; width: {{v.prog}}%; background: var(--fg); border-radius: 2px"></div></div>
                <span style="font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap">{{v.posT}} / {{v.dur}}</span>
              </div>
              <div style="display: flex; gap: 4px; margin-top: 8px; margin-left: 46px">
                <button class="ib" aria-label="Call back {{v.who}}" onClick="{{v.call}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.phone}}"></path></svg></button>
                <sc-if value="{{v.hasMsg}}" hint-placeholder-val="{{true}}">
                  <button class="ib" aria-label="{{v.msgLabel}}" onClick="{{v.msg}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.bubble}}"></path></svg></button>
                </sc-if>
                <sc-if value="{{v.hasAdd}}" hint-placeholder-val="{{false}}">
                  <button class="ib" aria-label="{{v.addLabel}}" onClick="{{v.add}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.phoneAddP}}"></path></svg></button>
                </sc-if>
                <button class="ib" aria-label="Delete voicemail" onClick="{{v.del}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.trash}}"></path></svg></button>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{phone.noVms}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; justify-content: center; padding-top: 80px; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 40px; height: 40px; stroke-width: 1.2"><path d="{{ic.phoneVm}}"></path></svg></div>
      </sc-if>
    </div>
  </sc-if>


  <!-- IN CALL (immersive) -->
  <sc-if value="{{phone.callFull}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; z-index: 6; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center">
      <div style="margin-top: 108px; padding: 0 28px; text-align: center; width: 100%; box-sizing: border-box; flex-shrink: 0">
        <div class="serif" style="font-size: 38px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{phone.cName}}</div>
        <div style="font-size: 16px; color: #8F8F8F; margin-top: 8px; font-variant-numeric: tabular-nums">{{phone.cStatus}}</div>
        <sc-if value="{{phone.aiOn}}" hint-placeholder-val="{{false}}">
          <div style="display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,.1); font-size: 13px">
            <span class="dot" style="width: 6px; height: 6px; border-radius: 3px; background: #8A93FF"></span><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 16px"><span class="al">α</span></span><span>Notes</span>
          </div>
        </sc-if>
      </div>
      <div style="flex-grow: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0">
        <sc-if value="{{phone.showAvatar}}" hint-placeholder-val="{{true}}">
          <div style="position: relative; width: 140px; height: 140px">
            <sc-if value="{{phone.calling}}" hint-placeholder-val="{{false}}"><span class="ring" style="position: absolute; inset: 0; border-radius: 70px; background: rgba(255,255,255,.14)"></span></sc-if>
            <span class="serif" style="position: absolute; inset: 0; border-radius: 70px; background: #1C1C1C; display: flex; align-items: center; justify-content: center; font-size: 50px">{{phone.cIni}}</span>
          </div>
        </sc-if>
        <sc-if value="{{phone.showLines}}" hint-placeholder-val="{{false}}">
          <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding: 0 32px 24px; box-sizing: border-box; overflow: hidden">
            <sc-for list="{{phone.lines}}" as="l" hint-placeholder-count="3">
              <div class="enter">
                <div style="font-size: 12px; color: #8F8F8F; margin-bottom: 3px">{{l.who}}</div>
                <div style="font-size: 19px; line-height: 1.35; {{l.css}}">{{l.text}}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{phone.showDkp}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; align-items: center">
            <div style="height: 40px; font-size: 26px; font-weight: 300; letter-spacing: .1em">{{phone.kpd}}</div>
            <div style="display: grid; grid-template-columns: repeat(3, 64px); gap: 12px 28px; margin-top: 8px">
              <sc-for list="{{phone.dkeys}}" as="k" hint-placeholder-count="12">
                <button aria-label="{{k.label}}" onClick="{{k.press}}" style="width: 64px; height: 64px; border-radius: 32px; background: rgba(255,255,255,.12); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center">
                  <span style="font-size: 26px; line-height: 1">{{k.d}}</span>
                  <span style="font-size: 9px; letter-spacing: .14em; color: #8F8F8F; height: 10px">{{k.sub}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; gap: 12px; margin: 16px 0 30px; flex-shrink: 0">
        <sc-for list="{{phone.controls}}" as="c" hint-placeholder-count="5">
          <button aria-label="{{c.label}}" aria-pressed="{{c.on}}" onClick="{{c.toggle}}" style="width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s; {{c.css}}">
            <sc-if value="{{c.icon}}" hint-placeholder-val="{{true}}"><svg class="i" viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="{{c.d}}"></path></svg></sc-if>
            <sc-if value="{{c.glyph}}" hint-placeholder-val="{{false}}"><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 28px; line-height: 1; margin-top: -4px"><span class="al">α</span></span></sc-if>
          </button>
        </sc-for>
      </div>
      <button aria-label="End call" onClick="{{phone.endCall}}" style="width: 76px; height: 76px; border-radius: 38px; background: #E5383B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-bottom: 64px; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 30px; height: 30px; transform: rotate(135deg)"><path d="{{ic.phone}}"></path></svg></button>
    </div>
  </sc-if>

  <!-- INCOMING (immersive) -->
  <sc-if value="{{phone.ringing}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; z-index: 7; background: #000000; color: #FFFFFF; display: flex; flex-direction: column; align-items: center">
      <div style="margin-top: 108px; padding: 0 28px; text-align: center; width: 100%; box-sizing: border-box; flex-shrink: 0">
        <div class="serif" style="font-size: 38px; line-height: 1.1">{{phone.rName}}</div>
        <div style="font-size: 16px; color: #8F8F8F; margin-top: 8px">{{phone.rSub}}</div>
        <sc-if value="{{phone.isRing}}" hint-placeholder-val="{{true}}">
          <div style="display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: #BDBDBD"><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 17px; color: #8A93FF"><span class="al">α</span></span><span>{{phone.rCtx}}</span></div>
        </sc-if>
        <sc-if value="{{phone.scrLive}}" hint-placeholder-val="{{false}}">
          <div style="display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,.1); font-size: 13px">
            <span class="dot" style="width: 6px; height: 6px; border-radius: 3px; background: #8A93FF"></span><span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 16px"><span class="al">α</span></span><span>{{name}} is answering</span>
          </div>
        </sc-if>
      </div>
      <div style="flex-grow: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0">
        <sc-if value="{{phone.isRing}}" hint-placeholder-val="{{true}}">
          <div style="position: relative; width: 140px; height: 140px">
            <span class="ring" style="position: absolute; inset: 0; border-radius: 70px; background: rgba(255,255,255,.14)"></span>
            <span class="serif" style="position: absolute; inset: 0; border-radius: 70px; background: #1C1C1C; display: flex; align-items: center; justify-content: center; font-size: 50px">{{phone.rIni}}</span>
          </div>
        </sc-if>
        <sc-if value="{{phone.isScreen}}" hint-placeholder-val="{{false}}">
          <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding: 0 32px 24px; box-sizing: border-box; overflow: hidden">
            <sc-for list="{{phone.scrLines}}" as="l" hint-placeholder-count="3">
              <div class="enter">
                <div style="font-size: 12px; color: #8F8F8F; margin-bottom: 3px">{{l.who}}</div>
                <div style="font-size: 19px; line-height: 1.35; {{l.css}}">{{l.text}}</div>
              </div>
            </sc-for>
            <sc-if value="{{phone.scrDone}}" hint-placeholder-val="{{false}}">
              <div class="enter" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 22px; background: rgba(255,255,255,.1)">
                <span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 20px; color: #8A93FF; line-height: 1.1"><span class="al">α</span></span>
                <span style="font-size: 16px; line-height: 1.4">{{phone.scrSum}}</span>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{phone.isRing}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; gap: 10px; margin-bottom: 36px; flex-shrink: 0">
          <button onClick="{{phone.openReply}}" aria-label="Reply with message" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 24px; background: rgba(255,255,255,.12); font-size: 15px; font-weight: 500">
            <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="{{ic.bubble}}"></path></svg><span>Reply</span>
          </button>
          <button onClick="{{phone.alphaAnswer}}" aria-label="Let {{name}} answer" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 24px; background: rgba(255,255,255,.12); font-size: 15px; font-weight: 500">
            <span style="font-family: Denton, Fraunces, Georgia, serif; font-style: italic; font-size: 20px; line-height: 1; margin-top: -3px; color: #8A93FF"><span class="al">α</span></span><span>{{name}} answers</span>
          </button>
        </div>
      </sc-if>
      <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 64px; box-sizing: border-box; margin-bottom: 64px; flex-shrink: 0">
        <sc-if value="{{phone.isRing}}" hint-placeholder-val="{{true}}">
          <button aria-label="Decline" onClick="{{phone.decline}}" style="width: 76px; height: 76px; border-radius: 38px; background: #E5383B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 30px; height: 30px; transform: rotate(135deg)"><path d="{{ic.phone}}"></path></svg></button>
        </sc-if>
        <sc-if value="{{phone.isScreen}}" hint-placeholder-val="{{false}}">
          <button aria-label="Hang up" onClick="{{phone.endScreen}}" style="width: 76px; height: 76px; border-radius: 38px; background: #E5383B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 30px; height: 30px; transform: rotate(135deg)"><path d="{{ic.phone}}"></path></svg></button>
        </sc-if>
        <button aria-label="Accept" onClick="{{phone.accept}}" style="width: 76px; height: 76px; border-radius: 38px; background: #1e9e4a; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 30px; height: 30px"><path d="{{ic.phone}}"></path></svg></button>
      </div>

      <sc-if value="{{phone.rsOpen}}" hint-placeholder-val="{{false}}">
        <button aria-label="Close replies" onClick="{{phone.closeReply}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 1"></button>
        <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: #151515; border-radius: 28px 28px 0 0; padding: 8px 16px 48px">
          <div style="width: 36px; height: 4px; border-radius: 2px; background: #3A3A3A; margin: 0 auto 6px"></div>
          <div style="display: flex; align-items: center; padding-left: 6px; margin-bottom: 10px"><span class="serif" style="flex-grow: 1; font-size: 26px">Reply</span><button class="ib" aria-label="Close" onClick="{{phone.closeReply}}" style="color: #fff"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button></div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{phone.replies}}" as="r" hint-placeholder-count="3">
              <button onClick="{{r.send}}" style="height: 56px; padding: 0 20px; border-radius: 18px; background: rgba(255,255,255,.07); font-size: 16px; text-align: left">{{r.text}}</button>
            </sc-for>
            <button onClick="{{phone.writeReply}}" aria-label="Write a message" style="height: 56px; padding: 0 20px; border-radius: 18px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #BDBDBD">
              <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.edit}}"></path></svg><span>Write…</span>
            </button>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
