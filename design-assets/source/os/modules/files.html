<div style="display: flex; flex-direction: column; height: 100%; position: relative">
  <sc-if value="{{files.notSearching}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 20px; gap: 2px; flex-shrink: 0">
      <h1 class="serif" style="margin: 0; font-size: 32px; flex-grow: 1; letter-spacing: -.01em">Files</h1>
      <button class="ib" aria-label="Search files" onClick="{{files.search}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.search}}"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{files.searching}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px 0 12px; gap: 4px; flex-shrink: 0">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 24px; background: var(--s2)">
        <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.search}}"></path></svg>
        <input aria-label="Search files" placeholder="Search" value="{{files.q}}" onChange="{{files.onQ}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 16px">
      </div>
      <button class="ib" aria-label="Close search" onClick="{{files.endSearch}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button>
    </div>
  </sc-if>

  <sc-if value="{{files.top}}" hint-placeholder-val="{{true}}">
  <div class="scr" style="flex-grow: 1; overflow-y: auto; touch-action: pan-y; padding: 8px 16px 150px; box-sizing: border-box">
    <sc-if value="{{files.noQuery}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{files.locs}}" as="l" hint-placeholder-count="5">
          <button onClick="{{l.go}}" class="tap" aria-label="{{l.name}}" style="height: 104px; border-radius: 24px; background: var(--s2); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
            <svg class="i" viewBox="0 0 24 24" style="color: var(--acct)"><path d="{{l.d}}"></path></svg>
            <div><div style="font-size: 16px; font-weight: 600">{{l.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{l.sub}}</div></div>
          </button>
        </sc-for>
        <div style="height: 104px; border-radius: 24px; background: var(--s2); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
          <svg class="i" viewBox="0 0 24 24" style="color: var(--mut)"><path d="{{ic.filesDisk}}"></path></svg>
          <div>
            <div style="height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden"><div style="height: 100%; width: {{files.storageW}}; background: var(--acc); border-radius: 3px"></div></div>
            <div style="font-size: 13px; color: var(--mut); margin-top: 8px">218 GB free</div>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 18px">
        <sc-for list="{{files.recent}}" as="r" hint-placeholder-count="5">
          <button onClick="{{r.tap}}" aria-label="{{r.label}}" class="tap" style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px; text-align: left">
            <span style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--s2); color: var(--fg)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.d}}"></path></svg></span>
            <div style="min-width: 0; flex-grow: 1"><div style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></div>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{files.hasQuery}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{files.results}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.tap}}" aria-label="{{r.label}}" class="tap" style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px; text-align: left; width: 100%">
          <span style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--s2); color: var(--fg)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.d}}"></path></svg></span>
          <div style="min-width: 0; flex-grow: 1"><div style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></div>
        </button>
      </sc-for>
      <sc-if value="{{files.noResults}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 110px; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="{{ic.search}}"></path></svg><div style="font-size: 15px">No matches</div></div>
      </sc-if>
      <div style="display: flex; justify-content: center; margin-top: 18px">
        <button onClick="{{files.askSearch}}" aria-label="{{files.askQ}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--s2); font-size: 14px; font-weight: 600; max-width: 100%; overflow: hidden; white-space: nowrap"><span class="serif" style="font-style: italic; font-weight: 400; font-size: 18px; line-height: 1; color: var(--acct)">&#945;</span>{{files.askQ}}</button>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <!-- folder -->
  <sc-if value="{{files.inFolder}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 4">
      <sc-if value="{{files.notSel}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
          <button class="ib" aria-label="Back to files" onClick="{{files.fd.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
          <h1 class="serif" style="margin: 0 0 0 6px; font-size: 26px; flex-grow: 1; min-width: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{files.fd.name}}</h1>
          <button class="ib" aria-label="View and sort" onClick="{{files.fd.openMenu}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{files.fd.viewIcon}}"></path></svg></button>
          <button class="ib" aria-label="Select files" onClick="{{files.fd.select}}"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.filesSelect}}"></path></svg></button>
        </div>
      </sc-if>
      <sc-if value="{{files.isSel}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
          <button class="ib" aria-label="Exit selection" onClick="{{files.exitSel}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button>
          <button onClick="{{files.selAll}}" aria-label="Select all" style="flex-grow: 1; text-align: left; height: 44px; padding-left: 6px"><span class="serif" style="font-size: 28px">{{files.selCount}}</span></button>
          <button class="ib" aria-label="Share selected" onClick="{{files.selShare}}" style="opacity: {{files.selOp}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
          <button class="ib" aria-label="Move selected" onClick="{{files.selMove}}" style="opacity: {{files.selOp}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.filesMove}}"></path></svg></button>
          <button class="ib" aria-label="Delete selected" onClick="{{files.selDel}}" style="opacity: {{files.selOp}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
        </div>
      </sc-if>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; touch-action: pan-y; padding: 8px 16px 150px; box-sizing: border-box">
        <sc-if value="{{files.fd.empty}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; align-items: center; padding-top: 140px; color: var(--mut)"><svg class="i" viewBox="0 0 24 24" style="width: 44px; height: 44px"><path d="{{ic.folder}}"></path></svg></div>
        </sc-if>
        <sc-if value="{{files.isList}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{files.fd.items}}" as="r" hint-placeholder-count="4">
            <button onClick="{{r.tap}}" aria-label="{{r.label}}" class="tap" style="display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 18px; text-align: left; width: 100%; {{r.rowCss}}">
              <span style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--s2); color: var(--fg)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{r.d}}"></path></svg></span>
              <div style="min-width: 0; flex-grow: 1"><div style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div><div style="font-size: 13px; color: var(--mut); margin-top: 2px">{{r.sub}}</div></div>
              <sc-if value="{{r.isFolder}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{ic.right}}"></path></svg></sc-if>
              <sc-if value="{{r.selOn}}" hint-placeholder-val="{{false}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.4"><path d="{{ic.check}}"></path></svg></span></sc-if>
              <sc-if value="{{r.selOff}}" hint-placeholder-val="{{false}}"><span style="width: 24px; height: 24px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--mut); flex-shrink: 0"></span></sc-if>
            </button>
          </sc-for>
        </sc-if>
        <sc-if value="{{files.isGrid}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{files.fd.items}}" as="r" hint-placeholder-count="4">
              <button onClick="{{r.tap}}" aria-label="{{r.label}}" class="tap" style="display: flex; flex-direction: column; justify-content: flex-start; border-radius: 22px; background: var(--s2); padding: 8px 8px 14px; text-align: left; position: relative; {{r.rowCss}}">
                <span style="height: 96px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg)"><svg class="i" viewBox="0 0 24 24" style="width: 32px; height: 32px"><path d="{{r.d}}"></path></svg></span>
                <div style="font-size: 14px; font-weight: 500; margin: 10px 6px 0; line-height: 1.3; overflow: hidden; word-break: break-word; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{r.name}}</div>
                <sc-if value="{{r.selOn}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg)"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.4"><path d="{{ic.check}}"></path></svg></span></sc-if>
                <sc-if value="{{r.selOff}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--mut); background: var(--bg)"></span></sc-if>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{files.menuOpen}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close menu" onClick="{{files.closeMenu}}" style="position: absolute; inset: 0; z-index: 7"></button>
    <div class="drop" style="position: absolute; top: 96px; right: 12px; width: 220px; z-index: 8; background: var(--bg); border-radius: 22px; padding: 6px; box-shadow: 0 0 0 1px var(--line), 0 16px 40px var(--shc)">
      <sc-for list="{{files.fd.menuRows}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.go}}" aria-label="{{m.label}}" aria-pressed="{{m.on}}" class="tap" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 12px; border-radius: 16px; font-size: 15px; text-align: left">
          <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{m.d}}"></path></svg><span style="flex-grow: 1">{{m.label}}</span>
          <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.check}}"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- preview -->
  <sc-if value="{{files.isPreview}}" hint-placeholder-val="{{false}}">
    <div class="enter" style="position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 6">
      <div style="display: flex; align-items: center; height: 56px; margin-top: 44px; padding: 0 8px; gap: 2px; flex-shrink: 0">
        <button class="ib" aria-label="Back" onClick="{{files.pv.close}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.back}}"></path></svg></button>
        <div style="flex-grow: 1"></div>
        <button class="ib" aria-label="Share file" onClick="{{files.pv.share}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.share}}"></path></svg></button>
        <button class="ib" aria-label="Move file" onClick="{{files.pv.move}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.filesMove}}"></path></svg></button>
        <button class="ib" aria-label="Delete file" onClick="{{files.pv.del}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.trash}}"></path></svg></button>
      </div>
      <div class="scr" style="flex-grow: 1; overflow-y: auto; padding: 4px 24px 170px; touch-action: pan-y">
        <sc-if value="{{files.pv.notRenaming}}" hint-placeholder-val="{{true}}">
          <button onClick="{{files.pv.startRename}}" aria-label="Rename" style="display: block; width: 100%; text-align: left">
            <span class="serif" style="font-size: 28px; line-height: 1.15; letter-spacing: -.01em; word-break: break-word">{{files.pv.name}}</span>
          </button>
        </sc-if>
        <sc-if value="{{files.pv.renaming}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 6px; height: 52px; padding: 0 4px 0 16px; border-radius: 26px; background: var(--s2)">
            <input aria-label="File name" value="{{files.pv.rn}}" onChange="{{files.pv.onRn}}" onKeyDown="{{files.pv.rnKey}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 18px">
            <span style="font-size: 15px; color: var(--mut)">{{files.pv.ext}}</span>
            <button aria-label="Save name" onClick="{{files.pv.saveRn}}" style="width: 44px; height: 44px; border-radius: 22px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.check}}"></path></svg></button>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
          <svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--mut)"><path d="{{files.pv.d}}"></path></svg>
          <span style="font-size: 14px; color: var(--mut)">{{files.pv.meta}}</span>
        </div>
        <sc-if value="{{files.pv.canAsk}}" hint-placeholder-val="{{true}}">
          <button onClick="{{files.pv.ask}}" aria-label="{{name}}: summarize this file" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 14px; margin-top: 14px; border-radius: 18px; background: var(--s2); font-size: 14px; font-weight: 600"><span class="serif" style="font-style: italic; font-weight: 400; font-size: 18px; line-height: 1; color: var(--acct)">&#945;</span>{{files.pv.askLabel}}</button>
        </sc-if>

        <sc-if value="{{files.pv.asking}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 24px; background: var(--s2); margin-top: 20px">
            <span class="dot" style="display: block"><span class="serif" style="font-style: italic; font-weight: 400; font-size: 24px; line-height: 1; color: var(--acct)">&#945;</span></span>
            <div class="dot" style="height: 12px; width: 86%; border-radius: 6px; background: var(--s3)"></div>
            <div class="dot" style="height: 12px; width: 62%; border-radius: 6px; background: var(--s3)"></div>
          </div>
        </sc-if>
        <sc-if value="{{files.pv.asked}}" hint-placeholder-val="{{false}}">
          <div class="enter" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 24px; background: var(--s2); margin-top: 20px">
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span class="serif" style="font-style: italic; font-weight: 400; font-size: 24px; line-height: 1; color: var(--acct)">&#945;</span>
              <button class="ib" aria-label="Save to Notes" onClick="{{files.pv.saveSum}}" style="margin: -10px -10px -10px 0; color: var(--acct)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{ic.bookmark}}"></path></svg></button>
            </div>
            <sc-for list="{{files.pv.sum}}" as="b" hint-placeholder-count="3">
              <div style="display: flex; gap: 12px"><span style="width: 6px; height: 6px; border-radius: 3px; background: var(--acct); margin-top: 8px; flex-shrink: 0"></span><span style="font-size: 15px; line-height: 1.45">{{b}}</span></div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{files.pv.isPages}}" hint-placeholder-val="{{true}}">
          <sc-for list="{{files.pv.pages}}" as="pg" hint-placeholder-count="2">
            <div style="margin-top: 20px; aspect-ratio: 0.77; border-radius: 8px; background: {{files.pv.paper}}; box-shadow: 0 0 0 1px var(--line), 0 8px 24px var(--shc); padding: 30px 26px; box-sizing: border-box; color: #1A1A1A; overflow: hidden; position: relative">
              <sc-if value="{{pg.first}}" hint-placeholder-val="{{true}}">
                <div style="font-family: 'Denton', 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 400; margin-bottom: 18px">{{pg.heading}}</div>
                <sc-for list="{{pg.rows}}" as="r" hint-placeholder-count="4">
                  <div style="display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #E4E4E4; font-size: 11.5px"><span style="width: 84px; flex-shrink: 0; color: #777">{{r.k}}</span><span style="font-weight: 500">{{r.v}}</span></div>
                </sc-for>
                <div style="height: 16px"></div>
              </sc-if>
              <sc-for list="{{pg.lines}}" as="l" hint-placeholder-count="8">
                <div style="height: 6px; border-radius: 3px; background: #DDDDDD; margin: 9px 0; width: {{l.w}}%"></div>
              </sc-for>
              <div style="position: absolute; bottom: 12px; right: 16px; font-size: 10px; color: #999">{{pg.num}}</div>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{files.pv.isReceipt}}" hint-placeholder-val="{{false}}">
          <div style="margin: 20px auto 0; width: 230px; background: {{files.pv.paper}}; color: #1A1A1A; padding: 26px 20px 30px; box-sizing: border-box; box-shadow: 0 0 0 1px var(--line), 0 8px 24px var(--shc); border-radius: 4px; font-family: 'Public Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px">
            <div style="text-align: center; font-size: 15px; letter-spacing: .2em; font-weight: 700">{{files.pv.receipt.shop}}</div>
            <div style="text-align: center; color: #888; margin: 4px 0 16px">600 Guerrero St</div>
            <sc-for list="{{files.pv.receipt.rows}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; justify-content: space-between; padding: 3px 0"><span>{{r.k}}</span><span>{{r.v}}</span></div>
            </sc-for>
            <div style="border-top: 1px dashed #AAA; margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; font-weight: 700; font-size: 13px"><span>TOTAL</span><span>{{files.pv.receipt.total}}</span></div>
          </div>
        </sc-if>
        <sc-if value="{{files.pv.isPhoto}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 20px; height: 300px; border-radius: 24px; background: {{files.pv.photoBg}}; position: relative; overflow: hidden">
            <div style="position: absolute; left: 50%; top: 44%; width: 70px; height: 70px; margin-left: -35px; border-radius: 35px; background: #FFE2A8; opacity: .9; display: {{files.pv.photoSun}}"></div>
          </div>
        </sc-if>
        <sc-if value="{{files.pv.isAudio}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 20px; padding: 22px 18px; border-radius: 24px; background: var(--s2)">
            <div style="display: flex; align-items: center; gap: 2px; height: 56px">
              <sc-for list="{{files.pv.wave}}" as="b" hint-placeholder-count="30"><span style="flex-grow: 1; height: {{b.h}}px; border-radius: 1px; background: {{b.c}}"></span></sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
              <button aria-label="{{files.pv.playLabel}}" onClick="{{files.pv.play}}" style="width: 52px; height: 52px; border-radius: 26px; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; {{files.pv.playCss}}"><path d="{{files.pv.playIcon}}"></path></svg></button>
              <span style="flex-grow: 1; font-size: 13px; color: var(--mut)">{{files.pv.time}}</span>
              <button onClick="{{files.pv.transcribe}}" aria-label="Transcribe in Notes" style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--bg); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--acct)"><path d="{{ic.notes}}"></path></svg>Transcribe</button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{files.pv.isArchive}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 20px; border-radius: 24px; background: var(--s2); padding: 6px 0">
            <sc-for list="{{files.pv.contents}}" as="c" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--mut)"><path d="{{c.d}}"></path></svg><span style="font-size: 15px">{{c.name}}</span></div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- move sheet -->
  <sc-if value="{{files.moveSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close move" onClick="{{files.closeSheet}}" style="position: absolute; inset: 0; z-index: 8; background: var(--scrim)"></button>
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 12px 40px; box-shadow: 0 -10px 40px var(--shc)">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--s3); margin: 0 auto 6px"></div>
      <div style="display: flex; align-items: center; padding-left: 12px; margin-bottom: 6px"><h2 class="serif" style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 300">Move to</h2><button class="ib" aria-label="Close" onClick="{{files.closeSheet}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button></div>
      <sc-for list="{{files.moveTo}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.go}}" aria-label="Move to {{m.name}}" class="tap" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 12px; border-radius: 18px; text-align: left">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="{{m.d}}"></path></svg></span>
          <div style="flex-grow: 1; min-width: 0"><div style="font-size: 16px">{{m.name}}</div><sc-if value="{{m.sub}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: var(--mut)">{{m.sub}}</div></sc-if></div>
          <sc-if value="{{m.here}}" hint-placeholder-val="{{false}}"><svg class="i" viewBox="0 0 24 24" style="color: var(--acct)"><path d="{{ic.check}}"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <!-- share sheet -->
  <sc-if value="{{files.shareSheet}}" hint-placeholder-val="{{false}}">
    <button aria-label="Close share" onClick="{{files.closeSheet}}" style="position: absolute; inset: 0; z-index: 8; background: var(--scrim)"></button>
    <div class="enter" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 20px 40px; box-shadow: 0 -10px 40px var(--shc)">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: var(--s3); margin: 0 auto 6px"></div>
      <div style="display: flex; align-items: center; margin-right: -8px"><h2 class="serif" style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 300">Share</h2><button class="ib" aria-label="Close" onClick="{{files.closeSheet}}"><svg class="i" viewBox="0 0 24 24"><path d="{{ic.x}}"></path></svg></button></div>
      <div style="display: flex; gap: 12px; padding-top: 14px">
        <button onClick="{{files.shareMsg}}" aria-label="Share in Messages" class="tap" style="flex: 1 1 0; height: 108px; border-radius: 24px; background: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.bubble}}"></path></svg>Messages</button>
        <button onClick="{{files.shareMail}}" aria-label="Share by email" class="tap" style="flex: 1 1 0; height: 108px; border-radius: 24px; background: var(--s2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="{{ic.mail}}"></path></svg>Email</button>
      </div>
    </div>
  </sc-if>

</div>
