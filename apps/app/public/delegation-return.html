<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Return to Alpha Phone</title><style>[hidden]{display:none!important}body{font-family:system-ui;margin:40px auto;padding:24px;max-width:420px;background:#f7f7f7;color:#171717}a{display:block;padding:16px;border-radius:28px;background:#171717;color:white;text-align:center;text-decoration:none}p{line-height:1.5}</style><h1>Return to Alpha Phone</h1><p id="message">Your account is checked inside Alpha Phone before the connection is saved.</p><a id="return" hidden>Continue in Alpha Phone</a><script>
(()=>{const q=new URLSearchParams(location.search),state=q.get('state'),code=q.get('code'),error=q.get('error');history.replaceState(null,'',location.pathname);if(!state||!/^[-\w]{43}$/.test(state)||q.getAll('state').length!==1||q.getAll('code').length>1||q.getAll('error').length>1||q.getAll('error_description').length>1||q.has('error_description')&&(!error||(q.get('error_description')||'').length>2000)||[...q.keys()].some(k=>!['state','code','error','error_description'].includes(k))||(!code&&!error)||code&&error||code&&code.length>4096){document.getElementById('message').textContent='This return link is invalid. Go back to Alpha Phone and reconnect.';return;}const u=new URL('alphaphone://cloud-delegation');u.searchParams.set('state',state);u.searchParams.set(code?'code':'error',code||'access_denied');const a=document.getElementById('return');a.href=u.href;a.hidden=false;})();
</script></html>
